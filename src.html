/* Jutsu Clash 3D. Layout: one stage (WebGL world + 2D overlay canvas), letterboxed on a warm dusk ground. Single deliberate look. */
:root{
  --ink:#3B2A25;
  --paper:#FFF7EA;
  --tone:#EADBC4;
  --red:#EF5459;
  --gold:#FFB52E;
  --fire:#FF6F3C;
  --water:#3BA4F2;
  --earth:#C4874A;
  --air:#3FC98A;
  --sakura:#FFB3C8;
  --ground:#2A1F2E;
  --display:'Mochiy Pop One','Arial Rounded MT Bold','Segoe UI',sans-serif;
  --body:'M PLUS Rounded 1c','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ground);display:grid;place-items:center;overflow:hidden;padding-inline:16px;font-family:var(--body)}
#stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink),0 24px 70px rgba(0,0,0,.55)}
#world,#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none;outline:none}
#game:focus-visible{box-shadow:inset 0 0 0 3px var(--gold)}
#nogl[hidden]{display:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);font:800 18px var(--body);text-align:center;padding:24px}
</style>

let HPK=1;function hpScale(n,mi){return HPK*(1+0.16*(n-1)+0.017*(n-1)**2)*MAPS[mi].hp;}
function makeWave(n){

function buildPath(pts){const segs=[];let L=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],len=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({ax:a[0],ay:a[1],bx:b[0],by:b[1],len,start:L,dx:(b[0]-a[0])/len,dy:(b[1]-a[1])/len});L+=len;}return{pts,segs,L};}
function posAt(P,d){d=Math.max(0,Math.min(P.L,d));for(const s of P.segs){if(d<=s.start+s.len){const u=d-s.start;return{x:s.ax+s.dx*u,y:s.ay+s.dy*u,dx:s.dx,dy:s.dy};}}const s=P.segs[P.segs.length-1];return{x:s.bx,y:s.by,dx:s.dx,dy:s.dy};}
function roadTiles(path){const set=new Set();for(let i=0;i<path.length-1;i++){const [ax,ay]=path[i],[bx,by]=path[i+1];const sx=Math.sign(bx-ax),sy=Math.sign(by-ay);let x=ax,y=ay;set.add(x+','+y);while(x!==bx||y!==by){x+=sx;y+=sy;set.add(x+','+y);}}return set;}
let rngS=1;const rnd=()=>{rngS=(rngS*16807)%2147483647;return (rngS-1)/2147483646;};

const AU={c:null,master:null,sfx:null,mus:null,noise:null};

function audioInit(){

  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();AU.c=c;
    AU.master=c.createGain();AU.master.gain.value=save.sound?0.7:0;AU.master.connect(c.destination);
    AU.sfx=c.createGain();AU.sfx.gain.value=0.8;AU.sfx.connect(AU.master);
    AU.mus=c.createGain();AU.mus.gain.value=save.music?0.3:0;AU.mus.connect(AU.master);
    const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
    MUS.next=c.currentTime+0.1;

}
function applyVolumes(){if(!AU.c)return;AU.master.gain.value=save.sound?0.7:0;AU.mus.gain.value=save.music?0.3:0;}
function tone(f,d,type,v,f2,when,dest){const c=AU.c;if(!c)return;const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(dest||AU.sfx);o.start(t);o.stop(t+d+0.05);}
function noise(d,v,freq,ft,when,dest,q){const c=AU.c;if(!c)return;const t=c.currentTime+(when||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;f.type=ft||'lowpass';f.frequency.value=freq||1000;f.Q.value=q||1;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(dest||AU.sfx);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}
const SFX={

function sfx(n,gap){if(!AU.c||!save.sound)return;const now=performance.now();if(now-(sfxLast[n]||0)<(gap||55))return;sfxLast[n]=now;SFX[n]&&SFX[n]();}
const MUS={step:0,next:0,mode:'title'};
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5];
const ROOTS=[130.81,110,174.61,146.83];
const MEL=[];(function(){let s=11;const r=()=>{s=(s*48271)%2147483647;return s/2147483647;};for(let i=0;i<64;i++){MEL.push(i%2===1&&r()<0.6?-1:(r()<0.25?-1:Math.floor(r()*6)));}})();
function musicTick(){
  const c=AU.c;if(!c||!save.music||!save.sound)return;
  if(MUS.next<c.currentTime-0.2)MUS.next=c.currentTime+0.05;
  const spb=60/104/4;
  while(MUS.next<c.currentTime+0.15){playStep(MUS.step,MUS.next-c.currentTime);MUS.next+=spb;MUS.step=(MUS.step+1)%128;}
}
function playStep(s,w){
  const st=s%16,bar=Math.floor(s/16)%4,root=ROOTS[bar],m=AU.mus,play=MUS.mode==='play',boss=MUS.mode==='boss';
  if(st===0||st===6||st===10)tone(root,0.28,'triangle',0.2,null,w,m);
  if(play||boss){
    if(st===0||st===8||(boss&&(st===4||st===12)))tone(140,0.14,'sine',0.3,45,w,m);
    if(st===4||st===12)noise(0.08,0.07,2400,'bandpass',w,m);
    if(st%2===0)noise(0.03,boss?0.04:0.025,8000,'highpass',w,m);
  }
  const n=MEL[(s+(bar%2)*16)%64];
  if(n>=0&&(play||boss||st%4===0))tone(SCALE[n]*(boss?0.5:1),0.2,boss?'square':'triangle',boss?0.025:0.05,null,w,m);
  if(!play&&!boss&&st===0)tone(root*4,1.4,'sine',0.05,null,w,m);

/* ---------------- input ---------------- */
const ptr={x:-99,y:-99,inside:false,down:null};

  e.preventDefault();

addEventListener('pointerup',e=>{

    if(!d.moved){if(d.btn===0)inQ.push({a:'click',x:ptr.x,y:ptr.y});else if(d.btn===2)inQ.push({a:'back'});}
  }

const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'confirm',Escape:'back',Backspace:'back',Space:'next',KeyN:'next',KeyE:'ult',KeyQ:'cycle',KeyF:'fuse',KeyU:'upgrade',KeyX:'sell',KeyP:'pause',KeyT:'speed',KeyM:'mute',Digit1:'b1',Digit2:'b2',Digit3:'b3',Digit4:'b4',KeyZ:'rotL',KeyC:'rotR',Equal:'zoomIn',Minus:'zoomOut'};

const PAD={prev:[],rep:{},cur:null};

  const pads=navigator.getGamepads?navigator.getGamepads():[];let gp=null;for(const p of pads)if(p&&p.connected){gp=p;break;}
  PAD.cur=gp;if(!gp)return;
  const now=performance.now();

const ULT_SECONDS=40;function ultNeed(){return ULT_SECONDS;}
function curUlt(){const a=ultsAvail();return a[G.ult.idx%a.length];}
function canCallWave(){return G.wave<20&&G.spawners.length===0&&!G.result;}
function earlyBonus(){return G.enemies.length>0&&G.wave>0?10+3*G.wave:0;}
function callWave(){
  if(!canCallWave()){sfx('deny');return false;}
  const b=earlyBonus();if(b){G.gold+=b;addTextS(W-170,140,'+'+b+' early',18,C.gold);}
  G.wave++;const list=makeWave(G.wave);G.waveLeft[G.wave]=list.length;G.spawners.push({wave:G.wave,list,i:0,t:0});
  sfx('gong');banner(G.wave===20?'FINAL WAVE':'WAVE '+G.wave,G.wave%5===0?'A boss is coming':'');
  MUS.mode=G.wave%5===0?'boss':'play';
  return true;
}
function banner(text,sub){G.banner={text,sub,t:0,dur:1.8};}
function spawnEnemy(type,wave,atD){
  const b=E[type],sc=hpScale(wave,G.mi);
  const e={type,wave,d:atD||0,hp:b.hp*sc,maxHp:b.hp*sc,speed:b.speed,armor:b.armor+Math.floor(wave/7),gold:b.gold,dmg:b.dmg,s:b.s,boss:b.boss||0,
    el:null,slowF:0,slowT:0,stunT:0,burnDps:0,burnT:0,x:-40,y:0,dx:1,dy:0,ph:Math.random()*6,blinkT:2.5+Math.random(),hitT:0,weakT:0,lift:0,elT:0,sumT:8};
  if(type==='shogun'){e.el=ELS[0];}
  else if(wave>=G.map.elStart&&type!=='runner'){const p=Math.min(0.65,0.08*(wave-G.map.elStart+1)+0.1);if(rnd()<p||type==='ronin')e.el=ELS[Math.floor(rnd()*4)];}
  const p=posAt(G.P,e.d);e.x=p.x;e.y=p.y;
  G.enemies.push(e);
  if(b.boss){shake=Math.max(shake,0.25);speedLines=1.2;addTextS(W/2,H/2-60,'ゴゴゴ',84,C.ink,'sfx');sfx('horn');banner(b.name.toUpperCase(),b.boss===2?'Changes element every few seconds':'Boss');}
  return e;
}
function elMult(els,el){if(!el)return 1;let m=0;for(const t of els){let v=1;if(t===el)v=0.5;else if(BEATS[t]===el)v=1.5;m=Math.max(m,v);}return m;}
function damage(e,amt,els,dot,src){
  if(e.dead)return;
  const m=elMult(els||[],e.el);amt*=m;
  if(!dot)amt=Math.max(amt*0.25,amt-e.armor);
  amt=Math.min(amt,e.hp);e.hp-=amt;G.dealt+=amt;
  if(src)src.dealt=(src.dealt||0)+amt;
  if(!dot){e.hitT=0.1;if(m>1&&e.weakT<=0){addText(e.x,e.y,'WEAK!',15,C.red,'small',e.s*1.1);e.weakT=1.4;}if(m<1&&e.weakT<=0){addText(e.x,e.y,'resist',13,C.ink,'small',e.s*1.1);e.weakT=1.4;}}
  if(e.hp<=0.01)kill(e);
}
function kill(e){
  e.dead=true;G.gold+=e.gold;G.waveLeft[e.wave]--;
  fxPuff(e.x,e.y,0.4*e.s,6,0xFFFFFF,e.s);fxSpark(e.x,e.y,0.5*e.s,6,0xFFD36B);fxHead(e);
  if(e.gold)addText(e.x,e.y,'+'+e.gold,13,C.gold,'small',e.s*0.9);
  sfx('pop',40);
  if(e.boss){shake=Math.max(shake,0.5);flash=RM?0:0.25;addText(e.x,e.y,e.boss===2?'ズドーン!':'バキッ!',72,C.paper,'sfx',e.s*1.2);sfx('boom');MUS.mode='play';fxPuff(e.x,e.y,0.5,16,0xFFFFFF,2);}
}
function slowE(e,f,dur){if(e.boss){f*=0.5;}if(f>=e.slowF||e.slowT<=0)e.slowF=Math.max(e.slowT>0?e.slowF:0,f);e.slowT=Math.max(e.slowT,dur);}
function stunE(e,dur){e.stunT=Math.max(e.stunT,e.boss?dur*0.3:dur);}
function applyFx(e,d,mul){
  if(e.dead)return;
  if(d.burn){e.burnDps=Math.max(e.burnT>0?e.burnDps:0,d.burn[0]*mul);e.burnT=Math.max(e.burnT,d.burn[1]);e.burnEls=d.els;}
  if(d.slow)slowE(e,d.slow[0],d.slow[1]);
  if(d.stun&&Math.random()<d.stun[1])stunE(e,d.stun[0]);
  if(d.knock&&!e.boss)e.d=Math.max(0,e.d-d.knock);
}
function addText(x,y,s,sz,col,style,h){G&&G.texts.push({x,y,h:h||1,s,sz,col,style,life:0,max:style==='sfx'?1.1:0.9,rot:style==='sfx'?(Math.random()-0.5)*0.3:0});}
function addTextS(x,y,s,sz,col,style){G&&G.texts.push({sx:x,sy:y,s,sz,col,style:style||'small',life:0,max:style==='sfx'?1.1:1.1,rot:style==='sfx'?(Math.random()-0.5)*0.3:0});}
const dmgMul=t=>1+0.3*t.up;
const rangeOf=t=>T[t.type].range*Math.min(1.25,1+0.025*t.up);
function upCost(t){const d=T[t.type],base=d.cost?d.cost*0.75:110;return Math.round(base*Math.pow(1.35,t.up)/5)*5;}
function sellValue(t){return Math.floor(t.spent*0.6);}
function build(tx,ty,type){
  if(!tileFree(tx,ty)){sfx('deny');return false;}const d=T[type];
  if(G.gold<d.cost){sfx('deny');addText(tc(tx),tc(ty),'Need '+d.cost,15,C.red,'small',0.8);return false;}
  G.gold-=d.cost;const t={type,tx,ty,x:tc(tx),y:tc(ty),up:0,cd:0.2,aim:Math.PI/2,fireT:0,spent:d.cost,dealt:0,beam:null,pop:0};
  G.grid[ty][tx].tower=t;G.towers.push(t);sfx('build');fxRing(t.x,t.y,0.05,0.2,0.9,hexN(C[d.els[0]]));fxPuff(t.x,t.y,0.1,6,0xFFFFFF,0.8);return true;
}
function upgrade(t){const c=upCost(t);if(G.gold<c){sfx('deny');addText(t.x,t.y,'Need '+c,15,C.red,'small',1.6);return false;}G.gold-=c;t.spent+=c;t.up++;t.pop=0.3;sfx('upgrade');fxSpark(t.x,t.y,1.3,10,0xFFC03A);addText(t.x,t.y,'POWER UP',14,C.ink,'small',1.8);return true;}
function sell(t){G.gold+=sellValue(t);G.grid[t.ty][t.tx].tower=null;G.towers=G.towers.filter(x=>x!==t);sfx('sell');fxPuff(t.x,t.y,0.3,8,0xFFFFFF,1);addText(t.x,t.y,'+'+sellValue(t),14,C.gold,'small',1);}
function canFuse(a,b){return a&&b&&a!==b&&T[a.type].cost&&T[b.type].cost;}
function fuse(a,b){
  if(!canFuse(a,b)){sfx('deny');return false;}
  const type=RECIPES[pairKey(a.type,b.type)];
  const t={type,tx:b.tx,ty:b.ty,x:b.x,y:b.y,up:a.up+b.up,cd:0.3,aim:b.aim,fireT:0,spent:a.spent+b.spent,dealt:0,beam:null,pop:0.5};
  G.grid[b.ty][b.tx].tower=t;G.grid[a.ty][a.tx].tower=null;G.towers=G.towers.filter(x=>x!==a&&x!==b);G.towers.push(t);
  sfx('fuse');shake=Math.max(shake,0.15);fxRing(t.x,t.y,0.05,0.3,2,hexN(C[T[type].els[0]]));fxRing(t.x,t.y,0.1,0.3,1.5,hexN(C[T[type].els[1]]));fxSpark(t.x,t.y,1,16,0xFFC03A);fxPuff(a.x,a.y,0.3,8,0xFFFFFF,1);
  const isNew=!save.codex.includes(type);
  if(isNew){save.codex.push(type);persist();banner('NEW FUSION  '+T[type].k+' '+T[type].name.toUpperCase(),'Added to the codex');}
  addText(t.x,t.y,T[type].k,46,C[T[type].els[0]],'sfx',2.2);
  if(G.sel){G.sel={tx:t.tx,ty:t.ty};}
  return true;
}

/* ---------------- ultimates ---------------- */
function tryUlt(){
  if(!G||G.result)return;const u=curUlt();
  if(G.ult.charge<ultNeed()){sfx('deny');addTextS(160,H-140,'Not charged yet',15,C.red);return;}
  if(u.target){G.targeting=true;G.menu=null;G.fuseFrom=null;if(padActive||!ptr.inside){G.cursor.x=tc(G.sel.tx);G.cursor.y=tc(G.sel.ty);}}
  else fireUlt(u,0,0);
}
function fireUlt(u,x,y){G.ult.charge=0;G.targeting=false;cutin={t:0,dur:RM?0.6:1.05,u,then:()=>doUlt(u,x,y)};sfx('cutin');}
function doUlt(u,x,y){
  const w=G.wave||1,sc=MAPS[G.mi].hp;
  if(u.id==='meteor'){G.specials.push({k:'meteor',x,y,t:0,dur:0.6,dmg:(450+130*w)*sc});}
  if(u.id==='tsunami'){
    G.specials.push({k:'wave',t:0,dur:1.4});sfx('wave');shake=Math.max(shake,0.35);addTextS(W/2,H/2,u.sfx,92,C.water,'sfx');
    for(const e of G.enemies){damage(e,(260+80*w)*sc,['water'],false,null);if(!e.dead){e.d=Math.max(0,e.d-(e.boss?90:240));slowE(e,0.5,3);}}
  }
  if(u.id==='tornado'){G.specials.push({k:'tornado',x,y,t:0,dur:3.5,r:210,dps:(70+24*w)*sc});sfx('wind');addText(x,y,u.sfx,76,C.air,'sfx',3);}
}

/* ---------------- update ---------------- */
function update(dt){
  G.time+=dt;
  {const need=ultNeed(),was=G.ult.charge;G.ult.charge=Math.min(need,G.ult.charge+dt);if(was<need&&G.ult.charge>=need){sfx('ready');addTextS(160,H-140,'Ultimate ready!',16,C.red);}}
  for(const s of G.spawners){s.t-=dt;while(s.t<=0&&s.i<s.list.length){const it=s.list[s.i];spawnEnemy(it.type,s.wave);s.t+=it.gap;s.i++;}}
  G.spawners=G.spawners.filter(s=>s.i<s.list.length);
  const P=G.P;
  for(const e of G.enemies){
    if(e.dead)continue;
    e.hitT-=dt;e.weakT-=dt;
    if(e.lift>0){e.lift-=dt;}
    else if(e.stunT>0)e.stunT-=dt;
    else{const sp=e.speed*(e.slowT>0?1-e.slowF:1);e.d+=sp*dt;e.ph+=sp*dt*0.16;}
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0;}
    if(e.burnT>0){e.burnT-=dt;damage(e,e.burnDps*dt,e.burnEls||['fire'],true,null);if(e.dead)continue;if(Math.random()<dt*6)fxFlame(e.x,e.y,0.5*e.s);}
    if(e.type==='ninja'&&e.stunT<=0&&e.lift<=0){e.blinkT-=dt;if(e.blinkT<=0){e.blinkT=3;fxPuff(e.x,e.y,0.3,6,0x8C84A8,0.8);e.d+=85;const q=posAt(P,e.d);fxPuff(q.x,q.y,0.3,6,0x8C84A8,0.8);}}
    if(e.type==='shogun'){e.elT+=dt;if(e.elT>6){e.elT=0;e.el=ELS[(ELS.indexOf(e.el)+1)%4];addText(e.x,e.y,EL[e.el].k+'!',40,C[e.el],'sfx',3);}
      e.sumT-=dt;if(e.sumT<=0){e.sumT=9;for(let i=0;i<3;i++){spawnEnemy('grunt',e.wave,Math.max(0,e.d-20-i*18));G.waveLeft[e.wave]++;}addText(e.x,e.y,'来い!',34,C.red,'sfx',2.6);}}
    const p=posAt(P,e.d);e.dx=p.dx;e.dy=p.dy;e.x=p.x;e.y=p.y;
    if(e.d>=P.L){e.dead=true;G.waveLeft[e.wave]--;G.hp-=e.dmg;shake=Math.max(shake,e.boss?0.5:0.18);sfx('leak');addText(e.x,e.y,'-'+e.dmg,22,C.red,'small',1.6);fxRing(e.x,e.y,0.05,0.2,1.6,0xEF5459);}
  }
  for(const t of G.towers)updateTower(t,dt);
  updateProjs(dt);
  for(const p of G.pools){p.t+=dt;for(const e of G.enemies){if(e.dead)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<p.r){damage(e,p.dps*dt,p.els,true,p.src);if(p.slow)slowE(e,p.slow,0.3);}}}
  G.pools=G.pools.filter(p=>p.t<p.dur);
  updateSpecials(dt);
  for(const n in G.waveLeft){if(G.waveLeft[n]<=0&&!G.cleared[n]&&!G.spawners.some(s=>s.wave==n)){G.cleared[n]=true;const b=12+2*n;G.gold+=b;addTextS(W/2,150,'Wave '+n+' cleared  +'+b,22,C.ink);}}
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(!G.result){
    if(G.hp<=0){G.hp=0;endGame(false);}
    else if(G.wave===20&&G.spawners.length===0&&G.enemies.length===0)endGame(true);
  }
}
function endGame(win){
  G.result=win?'win':'lose';G.resultT=0;MUS.mode='title';
  if(win){const first=!save.cleared[G.mi];save.cleared[G.mi]=true;G.unlocked=first?ULTS.find(u=>u.unlock===G.mi):null;sfx('win');}
  else sfx('lose');
  save.best[G.mi]=Math.max(save.best[G.mi]||0,win?20:G.wave-1);persist();focusId=null;
}
function firstInRange(t,range,exclude){let best=null;for(const e of G.enemies){if(e.dead||e.d<=60||(exclude&&exclude.has(e)))continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=range&&(!best||e.d>best.d))best=e;}return best;}
const handH=t=>0.95*(1+Math.min(0.2,t.up*0.02));
function updateTower(t,dt){
  const d=T[t.type],range=rangeOf(t),mul=dmgMul(t);t.cd-=dt;t.fireT-=dt;t.pop=Math.max(0,t.pop-dt);
  const aimAt=e=>{t.aim=Math.atan2(e.y-t.y,e.x-t.x);t.fireT=0.18;};
  if(d.kind==='beam'){
    const e=firstInRange(t,range);t.beam=e;
    if(e){aimAt(e);damage(e,d.dps*mul*dt,d.els,true,t);applyFx(e,d,mul);sfx('beam',120);}
    return;
  }
  if(t.cd>0)return;
  if(d.kind==='pulse'){
    let any=false;for(const e of G.enemies){if(e.dead||e.d<=60)continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=range){any=true;damage(e,d.dmg*mul,d.els,false,t);applyFx(e,d,mul);}}
    if(any){t.cd=1/d.rate;t.fireT=0.2;fxRing(t.x,t.y,0.15,0.1,range/TS,t.type==='sand'?0xC4874A:0xFFFFFF,t.type==='sand'?0.35:0.55);if(t.type==='steam')fxPuff(t.x,t.y,0.6,5,0xFFFFFF,1.2,range/TS*0.6);sfx('pulse',t.type==='sand'?250:80);}
    return;
  }
  const e=firstInRange(t,range);if(!e)return;
  t.cd=1/d.rate;aimAt(e);
  const hh=handH(t);
  if(d.kind==='bolt')G.projs.push({k:'bolt',x:t.x+Math.cos(t.aim)*10,y:t.y+Math.sin(t.aim)*10,h:hh,target:e,tx:e.x,ty:e.y,type:t.type,d,mul,src:t,speed:d.speed});
  else if(d.kind==='multi'){const hit=new Set();for(let i=0;i<d.n;i++){const tg=firstInRange(t,range,hit);if(!tg)break;hit.add(tg);G.projs.push({k:'bolt',x:t.x,y:t.y,h:hh,target:tg,tx:tg.x,ty:tg.y,type:t.type,d,mul,src:t,speed:d.speed});}}
  else if(d.kind==='lob'){const dist=Math.hypot(e.x-t.x,e.y-t.y),lead=e.speed*(e.slowT>0?1-e.slowF:1)*(0.45+dist/650)*(e.stunT>0?0:0.8);const p=posAt(G.P,e.d+lead);G.projs.push({k:'lob',sx:t.x,sy:t.y,h0:hh,tx:p.x,ty:p.y,t:0,dur:0.45+dist/650,h:(60+dist*0.3)/TS,type:t.type,d,mul,src:t});}
  else if(d.kind==='chain'){
    const hit=new Set([e]);const pts=[[t.x,t.y,hh],[e.x,e.y,0.45*e.s]];let cur=e,dm=d.dmg*mul;damage(e,dm,d.els,false,t);
    for(let i=0;i<d.chains;i++){let nb=null,bd=115;for(const o of G.enemies){if(o.dead||hit.has(o))continue;const dd=Math.hypot(o.x-cur.x,o.y-cur.y);if(dd<bd){bd=dd;nb=o;}}if(!nb)break;hit.add(nb);dm*=0.85;damage(nb,dm,d.els,false,t);pts.push([nb.x,nb.y,0.45*nb.s]);cur=nb;}
    fxBolt(pts);sfx('zap');
  }
  else if(d.kind==='root'){damage(e,d.dmg*mul,d.els,false,t);applyFx(e,d,mul);fxRoots(e.x,e.y);sfx('root');}
  const s={fire:'fire',water:'water',earth:'earth',air:'air',tempest:'air',ice:'ice',whirl:'water',mountain:'earth',magma:'earth'}[t.type];if(s)sfx(s,s==='air'?90:60);
}
function impactAt(x,y,p){
  const d=p.d,dm=d.dmg*p.mul,col=hexN(C[d.els[0]]);
  if(d.splash){for(const e of G.enemies){if(e.dead)continue;if(Math.hypot(e.x-x,e.y-y)<=d.splash+e.s*6){damage(e,dm,d.els,false,p.src);applyFx(e,d,p.mul);}}
    fxRing(x,y,0.05,0.1,d.splash/TS,col,0.35);fxChunks(x,y,p.type==='mountain'?12:6,hexN(C[d.els[d.els.length-1]]));
    if(p.type==='mountain'){shake=Math.max(shake,0.2);addText(x,y,'ドカッ',32,C.paper,'sfx',1.4);}
  } else if(p.target&&!p.target.dead){damage(p.target,dm,d.els,false,p.src);applyFx(p.target,d,p.mul);fxSpark(x,y,0.45*p.target.s,5,col);}
  if(d.pool)G.pools.push({x,y,r:d.pool.r,dps:d.pool.dps*p.mul,dur:d.pool.dur,t:0,slow:d.pool.slow,els:d.els,src:p.src,type:p.type});
  sfx('hit',70);
}
function updateProjs(dt){
  for(const p of G.projs){
    if(p.k==='bolt'){
      let th=0.45;if(p.target&&!p.target.dead){p.tx=p.target.x;p.ty=p.target.y;th=0.45*p.target.s;}
      const dx=p.tx-p.x,dy=p.ty-p.y,dd=Math.hypot(dx,dy),st=p.speed*dt;
      p.ang=Math.atan2(dy,dx);p.h=lerp(p.h,th,Math.min(1,st/Math.max(dd,1)));
      if(dd<=st+4){if(p.target&&p.target.dead&&!p.d.splash){p.done=true;continue;}impactAt(p.tx,p.ty,p);p.done=true;}
      else{p.x+=dx/dd*st;p.y+=dy/dd*st;}
      if(p.type==='fire'&&Math.random()<0.4)fxFlame(p.x,p.y,p.h,0.6);
    } else {p.t+=dt;if(p.t>=p.dur){impactAt(p.tx,p.ty,p);p.done=true;}}
  }
  G.projs=G.projs.filter(p=>!p.done);
}
function updateSpecials(dt){
  for(const s of G.specials){
    s.t+=dt;
    if(s.k==='meteor'&&s.t>=s.dur&&!s.hit){s.hit=true;
      for(const e of G.enemies){if(Math.hypot(e.x-s.x,e.y-s.y)<150){damage(e,s.dmg,['fire'],false,null);if(!e.dead){e.burnDps=Math.max(e.burnDps,20);e.burnT=4;e.burnEls=['fire'];}}}
      G.pools.push({x:s.x,y:s.y,r:90,dps:25*(G.wave||1)*0.6,dur:3,t:0,els:['fire'],type:'magma'});
      shake=Math.max(shake,0.6);flash=RM?0:0.2;speedLines=0.8;fxRing(s.x,s.y,0.05,0.5,4.2,0xFF6F3C,0.6);fxRing(s.x,s.y,0.1,0.3,3,0xFFFFFF,0.45);
      addText(s.x,s.y,'ドーン!',96,C.fire,'sfx',2.6);sfx('boom');fxChunks(s.x,s.y,20,0x7A5A4A);fxPuff(s.x,s.y,0.3,14,0xFFB36B,2.2);
    }
    if(s.k==='tornado'){
      for(const e of G.enemies){if(e.dead)continue;const dd=Math.hypot(e.x-s.x,e.y-s.y);if(dd<s.r){damage(e,s.dps*dt,['air'],true,null);if(e.boss)slowE(e,0.5,0.3);else{e.lift=Math.max(e.lift,0.25);}}}
    }
  }
  G.specials=G.specials.filter(s=>s.t<s.dur+(s.k==='meteor'?0.1:0));
}

/* ---------------- 3D effects ---------------- */
const P3=[];
function curScene(){return screen==='play'&&MAP3?MAP3.scene:LS;}
function addP(m,o){if(!R||!curScene())return;if(P3.length>420){const old=P3.shift();old.m.parent&&old.m.parent.remove(old.m);}m.castShadow=false;curScene().add(m);P3.push(Object.assign({m,life:0},o));}
function fxPuff(gx,gy,h,n,col,s,spread){const g=geo('puff',()=>new THREE.IcosahedronGeometry(0.12,0));for(let i=0;i<n;i++){const m=new THREE.Mesh(g,mat(col));const a=Math.random()*TAU,sp=(spread||0.6)*(0.6+Math.random()*0.6);m.position.copy(W3(gx,gy,h));addP(m,{vx:Math.cos(a)*sp*1.6,vy:0.6+Math.random()*1.2,vz:Math.sin(a)*sp*1.6,max:0.5+Math.random()*0.3,s0:(s||1)*(0.8+Math.random()*0.7),grav:-0.5,kind:'puff'});}}
function fxSpark(gx,gy,h,n,col){const g=geo('spark',()=>new THREE.OctahedronGeometry(0.06,0));for(let i=0;i<n;i++){const m=new THREE.Mesh(g,mat(col,{emissive:col,emissiveIntensity:0.6}));const a=Math.random()*TAU;m.position.copy(W3(gx,gy,h));addP(m,{vx:Math.cos(a)*2.5,vy:1+Math.random()*2.5,vz:Math.sin(a)*2.5,max:0.4+Math.random()*0.2,s0:1,grav:-7,kind:'spark',spin:8});}}
function fxChunks(gx,gy,n,col){const g=geo('chunk',()=>new THREE.BoxGeometry(0.1,0.1,0.1));for(let i=0;i<n;i++){const m=new THREE.Mesh(g,mat(col));const a=Math.random()*TAU,sp=1+Math.random()*2.5;m.position.copy(W3(gx,gy,0.1));addP(m,{vx:Math.cos(a)*sp,vy:2+Math.random()*3,vz:Math.sin(a)*sp,max:0.7,s0:0.7+Math.random()*0.9,grav:-12,kind:'chunk',spin:10,floor:true});}}
function fxFlame(gx,gy,h,s){const g=geo('flame',()=>new THREE.TetrahedronGeometry(0.08,0));const m=new THREE.Mesh(g,mat(Math.random()<0.5?0xFFB33C:0xFF6F3C,{emissive:0xFF7A2A,emissiveIntensity:0.7}));m.position.copy(W3(gx+(Math.random()-0.5)*8,gy+(Math.random()-0.5)*8,h));addP(m,{vx:0,vy:1.2,vz:0,max:0.35,s0:s||1,grav:0,kind:'flame',spin:6});}
function fxRing(gx,gy,h,r0,r1,col,max){const m=new THREE.Mesh(geo('fxring',()=>new THREE.RingGeometry(0.88,1,32)),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.85,depthWrite:false,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.copy(W3(gx,gy,h||0.05));addP(m,{vx:0,vy:0,vz:0,max:max||0.4,r0,r1,kind:'ring'});}
function fxRoots(gx,gy){const g=geo('rootc',()=>new THREE.ConeGeometry(0.07,0.45,4));for(let i=0;i<5;i++){const m=new THREE.Mesh(g,mat(i%2?0x5E8C3A:0x7AA84C));const a=i/5*TAU;m.position.copy(W3(gx+Math.cos(a)*9,gy+Math.sin(a)*9,0.15));m.rotation.set(Math.sin(a)*0.4,0,-Math.cos(a)*0.4);addP(m,{vx:0,vy:0,vz:0,max:0.9,s0:1,grav:0,kind:'root'});}}
function fxHead(e){if(!R)return;const m=new THREE.Mesh(geo('head',()=>new THREE.IcosahedronGeometry(0.23,1)),mat(e.type==='ninja'?E.ninja.outfit:SKIN));m.position.copy(W3(e.x,e.y,0.7*e.s));const a=Math.random()*TAU;addP(m,{vx:Math.cos(a)*1.2,vy:3.2,vz:Math.sin(a)*1.2,max:0.8,s0:e.s,grav:-9,kind:'head',spin:9});}
function fxBolt(pts){if(!R)return;const grp=new THREE.Group(),m=mat(0xFFE45C,{emissive:0xFFD12A,emissiveIntensity:1});const cg=geo('boltseg',()=>{const x=new THREE.CylinderGeometry(0.035,0.035,1,4);x.rotateX(Math.PI/2);x.translate(0,0,0.5);return x;});
  for(let i=0;i<pts.length-1;i++){const a=W3(pts[i][0],pts[i][1],pts[i][2]),b=W3(pts[i+1][0],pts[i+1][1],pts[i+1][2]);let prev=a;for(let k=1;k<=3;k++){const q=k===3?b:a.clone().lerp(b,k/3).add(new THREE.Vector3((Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3));const s=new THREE.Mesh(cg,m);s.position.copy(prev);s.lookAt(q);s.scale.z=prev.distanceTo(q);grp.add(s);prev=q;}}
  addP(grp,{vx:0,vy:0,vz:0,max:0.18,kind:'static'});}
function updateP3(dt){
  for(const p of P3){p.life+=dt;const u=p.life/p.max,m=p.m;
    if(p.kind==='ring'){const r=lerp(p.r0,p.r1,ease(u));m.scale.set(r,r,r);m.material.opacity=0.85*(1-u);}
    else if(p.kind==='root'){const g=u<0.2?u/0.2:u>0.7?1-(u-0.7)/0.3:1;m.scale.set(g,g,g);}
    else if(p.kind!=='static'){m.position.x+=p.vx*dt;m.position.y+=p.vy*dt;m.position.z+=p.vz*dt;p.vy+=p.grav*dt;if(p.kind==='puff'){p.vx*=0.94;p.vz*=0.94;}
      if(p.floor&&m.position.y<0.05){m.position.y=0.05;p.vy*=-0.3;p.vx*=0.6;p.vz*=0.6;}
      if(p.spin){m.rotation.x+=p.spin*dt;m.rotation.y+=p.spin*dt*0.7;}
      const s=p.s0*(p.kind==='puff'?(u<0.25?lerp(0.4,1.2,u/0.25):1.2*(1-(u-0.25)/0.75)):(1-u*u));m.scale.setScalar(Math.max(0.001,s));}
    if(u>=1){m.parent&&m.parent.remove(m);p.dead=true;}}
  for(let i=P3.length-1;i>=0;i--)if(P3[i].dead)P3.splice(i,1);
}

/* ---------------- 3D sync for game objects ---------------- */
const LIVE={enemies:new Map(),towers:new Map(),projs:new Map(),pools:new Map(),specials:new Map()};
function clearMeshes(){for(const k in LIVE){for(const [,m] of LIVE[k])m.parent&&m.parent.remove(m);LIVE[k].clear();}for(const p of P3)p.m.parent&&p.m.parent.remove(p.m);P3.length=0;}
function syncKind(kind,list,make,upd){
  const L=LIVE[kind],seen=new Set();
  for(const o of list){seen.add(o);let m=L.get(o);if(!m){m=make(o);if(!m)continue;MAP3.scene.add(m);L.set(o,m);}upd(o,m);}
  for(const [o,m] of L)if(!seen.has(o)){m.parent&&m.parent.remove(m);if(m.userData&&m.userData.beam)m.userData.beam.parent&&m.userData.beam.parent.remove(m.userData.beam);L.delete(o);}
}
function enemyMesh(e){
  const b=E[e.type],o={outfit:b.outfit,grumpy:true};
  if(e.type==='runner')o.hair='swept',o.hairCol=0x8A5A3B;
  if(e.type==='shield')o.shield=true;
  if(e.type==='brute')o.hair='swept',o.hairCol=0x3B2A25;
  if(e.type==='ninja')o.hood=true;
  if(e.type==='ronin')o.hat=true,o.katana=true;
  if(e.type==='shogun')o.kabuto=true,o.katana=true,o.cape=0xEF5459;
  if(e.el||e.type==='shogun')o.band=hexN(C[e.el||'fire']);
  const g=chibi(o);g.scale.setScalar(e.s*1.05);
  if(e.el){const orb=mesh(geo('elorb',()=>new THREE.OctahedronGeometry(0.08,0)),mat(hexN(C[e.el]),{emissive:hexN(C[e.el]),emissiveIntensity:0.5}),false);orb.position.y=1.12;g.add(orb);g.userData.orb=orb;}
  if(e.boss===2){const ring=mesh(geo('aura',()=>new THREE.TorusGeometry(0.45,0.03,4,20)),mat(0xFF6F3C,{emissive:0xFF6F3C,emissiveIntensity:0.8}),false);ring.rotation.x=Math.PI/2;ring.position.y=0.05;g.add(ring);g.userData.aura=ring;}
  const sl=mesh(geo('slowring',()=>new THREE.TorusGeometry(0.28,0.025,4,16)),mat(0x8BD3FF,{emissive:0x3BA4F2,emissiveIntensity:0.6}),false);sl.rotation.x=Math.PI/2;sl.position.y=0.04;sl.visible=false;g.add(sl);g.userData.slow=sl;
  return g;
}
function towerMesh(t){

  if(fused){const b2=mesh(geo('ped2',()=>new THREE.CylinderGeometry(0.46,0.5,0.14,6)),mat(0xBFB29C));b2.position.y=0.07;ped.add(b2);const band2=mesh(geo('pband2',()=>new THREE.CylinderGeometry(0.47,0.47,0.05,6)),mat(c1));band2.position.y=0.15;ped.add(band2);}
  const off=fused?0.14:0;
  const p=mesh(geo('ped',()=>new THREE.CylinderGeometry(0.36,0.42,0.26,6)),mat(0xD8CDB8));p.position.y=0.13+off;ped.add(p);
  const band=mesh(geo('pband',()=>new THREE.CylinderGeometry(0.37,0.37,0.06,6)),mat(c0));band.position.y=0.21+off;ped.add(band);
  const top=mesh(geo('ptopc',()=>new THREE.CylinderGeometry(0.33,0.36,0.04,6)),mat(0xEFE6D4));top.position.y=0.28+off;ped.add(top);
  const monk=chibi({outfit:c0,band:c0,hair:'spiky',cape:fused?c1:null});monk.position.y=0.3+off;monk.scale.setScalar(0.95);g.add(monk);
  const cr=new THREE.Group();cr.position.y=1.35+off;g.add(cr);
  const cg=geo('crys',()=>new THREE.OctahedronGeometry(0.1,0));const k1=mesh(cg,mat(c0,{emissive:c0,emissiveIntensity:0.45}),false);k1.scale.set(1,1.5,1);cr.add(k1);
  if(fused){k1.position.x=0.13;const k2=mesh(cg,mat(c1,{emissive:c1,emissiveIntensity:0.45}),false);k2.scale.set(1,1.5,1);k2.position.x=-0.13;cr.add(k2);}
  const stars=new THREE.Group();stars.position.y=1.1+off;g.add(stars);

  return g;

function projMesh(p){
  const el=p.d.els[0],col=hexN(C[el]);let m;
  if(p.k==='lob'){
    if(p.type==='whirl')m=mesh(geo('pw',()=>new THREE.IcosahedronGeometry(0.16,0)),mat(col,{emissive:col,emissiveIntensity:0.3}));
    else if(p.type==='magma')m=mesh(geo('pm',()=>new THREE.DodecahedronGeometry(0.17,0)),mat(0x5A3A30,{emissive:0xFF5A1F,emissiveIntensity:0.5}));
    else m=mesh(geo('pr',()=>new THREE.DodecahedronGeometry(0.16,0)),mat(0xB59A7A));
    if(p.type==='mountain')m.scale.setScalar(1.9);
    return m;}
  if(p.type==='fire')m=mesh(geo('pf',()=>new THREE.IcosahedronGeometry(0.11,0)),mat(0xFF8A3C,{emissive:0xFF6A1A,emissiveIntensity:0.9}),false);
  else if(p.type==='water')m=mesh(geo('pwa',()=>new THREE.IcosahedronGeometry(0.11,1)),mat(col,{emissive:col,emissiveIntensity:0.3,roughness:0.3}),false);
  else if(p.type==='ice')m=mesh(geo('pi',()=>new THREE.OctahedronGeometry(0.11,0)),mat(0xCDEBFF,{emissive:0x8BD3FF,emissiveIntensity:0.5}),false),m.scale.set(0.6,0.6,1.6);
  else m=mesh(geo('pa',()=>new THREE.TorusGeometry(0.12,0.03,3,8,Math.PI)),mat(col,{emissive:col,emissiveIntensity:0.6,side:THREE.DoubleSide}),false);
  if(p.type==='tempest')m.scale.setScalar(1.3);

}
function poolMesh(p){const g=new THREE.Group();const r=p.r/TS;

function specialMesh(s){
  if(s.k==='meteor'){const g=new THREE.Group();const r=mesh(new THREE.IcosahedronGeometry(0.9,0),mat(0x6B4A3E,{emissive:0xFF5A1F,emissiveIntensity:0.6}));g.add(r);const f=mesh(new THREE.IcosahedronGeometry(1.15,0),new THREE.MeshBasicMaterial({color:0xFFB33C,transparent:true,opacity:0.45}),false);g.add(f);
    const sh=mesh(new THREE.CircleGeometry(3.7,24),new THREE.MeshBasicMaterial({color:0xEF5459,transparent:true,opacity:0.25,depthWrite:false}),false);sh.rotation.x=-Math.PI/2;sh.userData.ground=true;g.userData.shadow=sh;MAP3.scene.add(sh);sh.position.copy(W3(s.x,s.y,0.05));g.userData.extra=sh;return g;}
  if(s.k==='wave'){const g=new THREE.Group();const w=mesh(new THREE.BoxGeometry(1.6,1.8,GH+8,1,3,6),mat(0x3BA4F2,{transparent:true,opacity:0.8}),false);w.position.y=0.9;g.add(w);const cap=mesh(new THREE.BoxGeometry(0.8,0.3,GH+8),mat(0xFFFFFF),false);cap.position.set(0.5,1.85,0);g.add(cap);return g;}

}
function sync3D(dt){
  if(!MAP3)return;
  const t=animT;
  syncKind('enemies',G.enemies,enemyMesh,(e,g)=>{
    const lift=e.lift>0?0.8+Math.sin(t*10+e.ph)*0.2:0,hop=e.stunT>0?0:Math.abs(Math.sin(e.ph))*0.05;
    g.position.set((e.x-640)/TS,hop+lift,(e.y-360)/TS);
    const yaw=Math.atan2(e.dx,e.dy);g.rotation.y=lift?g.rotation.y+dt*12:yaw;
    const amp=e.stunT>0||e.lift>0?0:1;animChibi(g,e.ph,amp,t);
    const sq=e.hitT>0?1:0,s=e.s*1.05;g.scale.set(s*(1+0.12*sq),s*(1-0.15*sq),s*(1+0.12*sq));
    if(g.userData.orb){g.userData.orb.rotation.y+=dt*3;g.userData.orb.position.y=1.12+Math.sin(t*4+e.ph)*0.04;}
    if(g.userData.aura){g.userData.aura.rotation.z+=dt*2;g.userData.aura.material=mat(hexN(C[e.el]),{emissive:hexN(C[e.el]),emissiveIntensity:0.8});}
    if(e.type==='shogun'&&g.userData.P.band)g.userData.P.band.material=mat(hexN(C[e.el]),{side:THREE.DoubleSide});
    g.userData.slow.visible=e.slowT>0&&e.slowF>0.05;
  });
  syncKind('towers',G.towers,towerMesh,(tw,g)=>{
    const U=g.userData,sc=1+Math.min(0.2,tw.up*0.02),pop=tw.pop>0?1+Math.sin(tw.pop/0.3*Math.PI)*0.15:1;
    g.position.set((tw.x-640)/TS,0,(tw.y-360)/TS);g.scale.setScalar(sc*pop);
    const dragging=G.drag&&G.drag.t===tw;g.position.y=dragging?0.25+Math.sin(t*10)*0.05:0;
    U.monk.rotation.y=Math.atan2(Math.cos(tw.aim),Math.sin(tw.aim));
    const P=U.monk.userData.P;const fire=tw.fireT>0||(tw.beam&&!tw.beam.dead);
    P.armR.rotation.x=lerp(P.armR.rotation.x,fire?-1.55:-0.15+Math.sin(t*2+tw.x)*0.05,0.3);P.armL.rotation.x=lerp(P.armL.rotation.x,fire?-0.5:0.1,0.3);
    P.legL.rotation.x=0;P.legR.rotation.x=0;P.head.position.y=0.7+Math.sin(t*2.4+tw.x)*0.012;if(P.tails)P.tails.forEach((x,i)=>x.rotation.x=0.3+Math.sin(t*7+i+tw.x)*0.2);if(P.cape)P.cape.rotation.x=0.3+Math.sin(t*4+tw.y)*0.08;
    U.cr.rotation.y+=dt*1.5;U.cr.position.y=1.35+U.off+Math.sin(t*2+tw.y)*0.05;
    if(U.up!==tw.up){U.up=tw.up;while(U.stars.children.length)U.stars.remove(U.stars.children[0]);const n=Math.min(tw.up,8);for(let i=0;i<n;i++){const s=mesh(geo('star',()=>new THREE.OctahedronGeometry(0.05,0)),mat(0xFFC03A,{emissive:0xFFA000,emissiveIntensity:0.5}),false);const a=i/n*TAU;s.position.set(Math.cos(a)*0.32,0,Math.sin(a)*0.32);U.stars.add(s);}}
    U.stars.rotation.y+=dt*1.2;
    // beam
    if(tw.beam&&!tw.beam.dead){if(!U.beam){U.beam=new THREE.Group();const b1=mesh(geo('beam1',()=>{const x=new THREE.CylinderGeometry(0.07,0.12,1,6,1,true);x.rotateX(Math.PI/2);x.translate(0,0,0.5);return x;}),mat(0xFF8A3C,{emissive:0xFF6A1A,emissiveIntensity:0.9,transparent:true,opacity:0.85}),false);const b2=mesh(geo('beam2',()=>{const x=new THREE.CylinderGeometry(0.03,0.05,1,5,1,true);x.rotateX(Math.PI/2);x.translate(0,0,0.5);return x;}),mat(0xFFE45C,{emissive:0xFFD12A,emissiveIntensity:1}),false);U.beam.add(b1,b2);MAP3.scene.add(U.beam);}
      const a=W3(tw.x+Math.cos(tw.aim)*12,tw.y+Math.sin(tw.aim)*12,handH(tw)*sc),b=W3(tw.beam.x,tw.beam.y,0.45*tw.beam.s);U.beam.position.copy(a);U.beam.lookAt(b);const L=a.distanceTo(b);U.beam.scale.set(1+Math.sin(t*40)*0.15,1+Math.sin(t*40)*0.15,L);U.beam.visible=true;if(Math.random()<0.4)fxFlame(tw.beam.x,tw.beam.y,0.5,0.8);}
    else if(U.beam)U.beam.visible=false;
  });
  syncKind('projs',G.projs,projMesh,(p,m)=>{
    if(p.k==='lob'){const u=p.t/p.dur;m.position.copy(W3(lerp(p.sx,p.tx,u),lerp(p.sy,p.ty,u),lerp(p.h0,0.15,u)+Math.sin(u*Math.PI)*p.h));m.rotation.x+=dt*8;m.rotation.z+=dt*5;}

    if(s.k==='wave'){const u=s.t/s.dur;g.position.set(lerp(-GW/2-4,GW/2+4,ease(u)),0,0);g.children[0].material.opacity=u>0.8?(1-u)/0.2*0.8:0.8;}
    if(s.k==='tornado'){g.rotation.y+=dt*6;const a=Math.min(1,s.t*3,(s.dur-s.t)*3);g.scale.setScalar(Math.max(0.01,a));g.children.forEach((c,i)=>{c.position.x=Math.sin(t*5+i*0.6)*0.15*i;});}
  });
  // hover / range visuals
  const M=MAP3;let ht=null;
  if(G.drag){ht=tileAtScreen(ptr.x,ptr.y);}
  else if(G.menu||padActive||kbNav)ht=G.sel;else ht=G.hover;
  M.hl.visible=!!ht&&!G.targeting&&!G.result;M.hlEdge.visible=M.hl.visible;
  if(ht){const x=ht.tx-GW/2+0.5,z=ht.ty-GH/2+0.5;M.hl.position.x=M.hlEdge.position.x=x;M.hl.position.z=M.hlEdge.position.z=z;
    const cell=G.grid[ht.ty][ht.tx];let col=0x8CF08C;if(cell.tower)col=0xFFD36B;else if(cell.road||cell.block)col=0xEF5459;

function openMenu(tile){

function closeMenu(){if(G)G.menu=null;focusId=null;}
function playInput(ev){
  const a=ev.a;
  if(a==='pause'){paused=true;closeMenu();G.targeting=false;focusId=null;return;}
  if(a==='speed'){G.speed=G.speed===1?2:1;toast('Speed '+G.speed+'×');return;}
  if(a==='rotL'){CAM.taz+=Math.PI/8;return;}if(a==='rotR'){CAM.taz-=Math.PI/8;return;}
  if(a==='zoomIn'){CAM.tr=clamp(CAM.tr*0.88,12,44);return;}if(a==='zoomOut'){CAM.tr=clamp(CAM.tr*1.12,12,44);return;}
  if(G.targeting){
    if(a==='click'){const b=hitUI(ev.x,ev.y);if(b&&b.hud){b.act&&b.act();return;}const g=groundAt(ev.x,ev.y);if(g)fireUlt(curUlt(),g.gx,g.gy);return;}
    if(a==='confirm'||a==='ult'){fireUlt(curUlt(),G.cursor.x,G.cursor.y);return;}
    if(a==='back'){G.targeting=false;return;}
    if(['up','down','left','right'].includes(a)){const f=camFwd(),rt=[-f[1],f[0]];const v=a==='up'?f:a==='down'?[-f[0],-f[1]]:a==='right'?rt:[-rt[0],-rt[1]];G.cursor.x=clamp(G.cursor.x+v[0]*40,0,W);G.cursor.y=clamp(G.cursor.y+v[1]*40,0,H);return;}
    return;

  if(a==='ult'){tryUlt();return;}
  if(a==='cycle'){const n=ultsAvail().length;if(n>1){G.ult.idx=(G.ult.idx+1)%n;sfx('click');}else toast('Clear a map to unlock more ultimates');return;}
  if(a==='click'){
    const b=hitUI(ev.x,ev.y);if(b){if(!b.disabled&&b.act)b.act();else sfx('deny');return;}
    const tile=tileAtScreen(ev.x,ev.y);
    if(tile){if(G.menu&&G.sel.tx===tile.tx&&G.sel.ty===tile.ty&&!G.fuseFrom){closeMenu();return;}openMenu(tile);}
    else{G.fuseFrom=null;closeMenu();}
    return;
  }
  if(a==='back'){if(G.fuseFrom){G.fuseFrom=null;return;}if(G.menu){closeMenu();return;}return;}
  if(G.menu){
    if(['up','down','left','right'].includes(a)){const b=UI.find(b=>b.dir===a);if(b){focusId=b.id;sfx('click');}return;}
    if(a==='confirm'){const b=UI.find(b=>b.id===focusId);if(b&&b.act&&!b.disabled)b.act();else if(b)sfx('deny');return;}
    const t=G.grid[G.sel.ty][G.sel.tx].tower;
    if(G.menu==='build'&&['b1','b2','b3','b4'].includes(a)){const ty=ELS[+a[1]-1];if(build(G.sel.tx,G.sel.ty,ty))closeMenu();return;}
    if(G.menu==='tower'&&t){
      if(a==='upgrade'){upgrade(t);return;}
      if(a==='fuse'){startFuse(t);return;}
      if(a==='sell'){sell(t);closeMenu();return;}
    }
    return;
  }
  if(['up','down','left','right'].includes(a)){moveSel(a);return;}
  if(a==='confirm'){openMenu(G.sel);return;}
  const t=G.grid[G.sel.ty][G.sel.tx].tower;
  if(t&&a==='upgrade')upgrade(t);
  if(t&&a==='fuse'&&!G.fuseFrom)startFuse(t);
  if(t&&a==='sell'&&!G.fuseFrom)sell(t);
}

  if(screen==='play'&&G){
    UI=[];drawPlayOverlay();
    if(speedLines>0)speedBurst(Math.min(1,speedLines),W/2,H/2);
    if(cutin)drawCutin();
    if(paused&&!G.result){UI=[];drawPause();}
    if(G.result){UI=[];drawResult();}
    if(flash>0){ctx.fillStyle=alpha('#FFFFFF',Math.min(0.8,flash*3));ctx.fillRect(0,0,W,H);}
  }
  else if(screen==='maps'){drawTitle();drawMaps();}
  else if(screen==='codex'){drawTitle();drawCodex();}
  else if(screen==='help'){drawTitle();drawHelp();}
  else drawTitle();
  if(toastMsg){const a=toastMsg.t>1.4?(1.8-toastMsg.t)/0.4:1;ctx.save();ctx.globalAlpha=a;ctx.font=font(15,false);const w=ctx.measureText(toastMsg.s).width+40;panel(W/2-w/2,H-136,w,38,{fill:C.ink,r:19});txt(toastMsg.s,W/2,H-116,15,{col:C.paper,align:'center'});ctx.restore();}
}

/* ---------------- test hooks ---------------- */
window.TD={
  get G(){return G;},LB,scr:(x,y,h)=>scr(x,y,h),setHPK(v){HPK=v;},get save(){return save;},T,RECIPES,MAPS,CAM,
  start:startMap,build,upgrade,fuse,sell,callWave,tryUlt,fireUlt,curUlt,ultNeed,tileFree,
  sim(sec){const st=1/60;for(let i=0;i<sec*60;i++){if(cutin){const f=cutin.then;cutin=null;f();}update(st);updateFx(st);if(G.result)break;}},
};

init3D();
resize();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Mochiy Pop One"','JUTSU火水土風').catch(()=>{});}
</script>
