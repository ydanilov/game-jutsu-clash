<style>

:root{
  --ink:#3B2A25;

  --tone:#EADBC4;
  --red:#EF5459;
  --gold:#FFB52E;
  --fire:#FF6F3C;
  --water:#3BA4F2;
  --earth:#C4874A;
  --air:#3FC98A;
  --sakura:#FFB3C8;
  --ground:#2A1F2E;
  --display:'Mochiy Pop One','Arial Rounded MT Bold','Segoe UI',sans-serif;
  --body:'M PLUS Rounded 1c','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
:root{padding:0!important}
body{margin:0;background:var(--ground);display:grid;place-items:center;overflow:hidden;font-family:var(--body);box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink),0 24px 70px rgba(0,0,0,.55)}
body.compact #stage{border-radius:0;box-shadow:none}
#world,#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none;outline:none}
#nogl[hidden]{display:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);font:800 18px var(--body);text-align:center;padding:24px}
#safeprobe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* portrait-phone prompt: the game plays in landscape */
#rotate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;box-sizing:border-box;
  background:linear-gradient(rgba(42,31,46,.25),rgba(42,31,46,.8)),url(assets/jc_title.webp) 50% 40%/cover no-repeat,linear-gradient(165deg,#7E9ED6,#C8A8D8 42%,#FFC29A 72%,#FFE3A6)}
#rotate[hidden]{display:none}
.rot-card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 rgba(59,42,37,.35);padding:24px 26px 20px;max-width:290px;text-align:center}
.rot-logo{font:38px/1 var(--display);color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.01em}
.rot-logo b{display:block;font-weight:400;color:var(--red);margin-top:2px}
.rot-seal{display:inline-block;margin:12px 0 0;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;font:800 13px var(--body);background:var(--paper)}
.rot-phone{width:44px;height:74px;margin:20px auto 16px;border:4px solid var(--ink);border-radius:11px;position:relative;background:var(--gold);animation:rot 2.6s cubic-bezier(.6,0,.3,1) infinite}
.rot-phone::after{content:'';position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
@keyframes rot{0%,18%{transform:rotate(0)}42%,78%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rot-phone{animation:none;transform:rotate(-90deg)}}
.rot-by{display:block;margin-top:8px;font:800 12px var(--body);opacity:.7}
.rot-card p{font:800 18px/1.3 var(--body);margin:0 0 6px}
.rot-card small{display:block;font:500 13px/1.4 var(--body);opacity:.75}
.rot-card button{margin-top:16px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:22px;background:var(--paper);color:var(--ink);font:800 14px var(--body);cursor:pointer}
.rot-card button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>

  const P=path.map(([i,j])=>new THREE.Vector2(i-GW/2+0.5,j-GH/2+0.5)),out=[P[0].clone()];
  const lineTo=q=>{const a=out[out.length-1],n=Math.max(1,Math.ceil(a.distanceTo(q)/0.2));for(let k=1;k<=n;k++)out.push(a.clone().lerp(q,k/n));};

function spawnEnemy(type,wave,atD){
  const b=E[type],sc=hpScale(wave,G.mi);
  const e={type,wave,d:atD||0,hp:b.hp*sc,maxHp:b.hp*sc,speed:b.speed,armor:b.armor+Math.floor(wave/7),gold:b.gold,dmg:b.dmg,s:b.s,boss:b.boss||0,
    el:null,slowF:0,slowT:0,stunT:0,burnDps:0,burnT:0,x:-40,y:0,dx:1,dy:0,ph:Math.random()*6,blinkT:2.5+Math.random(),hitT:0,weakT:0,lift:0,elT:0,sumT:8};
  if(type==='shogun'){e.el=ELS[0];}
  else if(wave>=G.map.elStart&&type!=='runner'){const p=Math.min(0.65,0.08*(wave-G.map.elStart+1)+0.1);if(rnd()<p||type==='ronin')e.el=ELS[Math.floor(rnd()*4)];}
  const p=posAt(G.P,e.d);e.x=p.x;e.y=p.y;e.bornT=G.time;
  G.enemies.push(e);
  if(!atD){fxPuff(e.x,e.y,0.6,e.boss?10:4,0xC9A6FF,e.boss?1.6:0.8);if(e.boss)fxRing(e.x,e.y,0.05,0.2,2.4,0x8D5BD9,0.6);}
  if(!b.boss&&!atD)enemyReveal(type);
  if(b.boss){shake=Math.max(shake,0.25);startBossCut(type);banner(b.name.toUpperCase(),b.boss===2?'Changes element every few seconds':'Boss');}
  return e;
}
function elMult(els,el){if(!el)return 1;let m=0;for(const t of els){let v=1;if(t===el)v=0.5;else if(BEATS[t]===el)v=1.5;m=Math.max(m,v);}return m;}
function damage(e,amt,els,dot,src){
  if(e.dead)return;
  const m=elMult(els||[],e.el);amt*=m;
  if(!dot)amt=Math.max(amt*0.25,amt-e.armor);
  amt=Math.min(amt,e.hp);e.hp-=amt;G.dealt+=amt;
  if(src)src.dealt=(src.dealt||0)+amt;
  if(!dot){e.hitT=0.1;if(m>1&&e.weakT<=0){addText(e.x,e.y,'WEAK!',15,C.red,'small',e.s*1.1);e.weakT=1.4;}if(m<1&&e.weakT<=0){addText(e.x,e.y,'resist',13,C.ink,'small',e.s*1.1);e.weakT=1.4;}}
  if(e.hp<=0.01)kill(e);
}
function kill(e){
  e.dead=true;G.gold+=e.gold;G.waveLeft[e.wave]--;
  fxPuff(e.x,e.y,0.4*e.s,6,0xFFFFFF,e.s);fxSpark(e.x,e.y,0.5*e.s,6,0xFFD36B);fxHead(e);
  if(e.gold)addText(e.x,e.y,'+'+e.gold,13,C.gold,'small',e.s*0.9);
  sfx('pop',40);
  if(e.boss){shake=Math.max(shake,0.5);flash=RM?0:0.25;addText(e.x,e.y,e.boss===2?'ズドーン!':'バキッ!',72,C.paper,'sfx',e.s*1.2);sfx('boom');MUS.mode='play';fxPuff(e.x,e.y,0.5,16,0xFFFFFF,2);}
}
function slowE(e,f,dur){if(e.boss){f*=0.5;}if(f>=e.slowF||e.slowT<=0)e.slowF=Math.max(e.slowT>0?e.slowF:0,f);e.slowT=Math.max(e.slowT,dur);}
function stunE(e,dur){e.stunT=Math.max(e.stunT,e.boss?dur*0.3:dur);}
function applyFx(e,d,mul){
  if(e.dead)return;
  if(d.burn){e.burnDps=Math.max(e.burnT>0?e.burnDps:0,d.burn[0]*mul);e.burnT=Math.max(e.burnT,d.burn[1]);e.burnEls=d.els;}
  if(d.slow)slowE(e,d.slow[0],d.slow[1]);
  if(d.stun&&Math.random()<d.stun[1])stunE(e,d.stun[0]);
  if(d.knock&&!e.boss)e.d=Math.max(0,e.d-d.knock);
}
function addText(x,y,s,sz,col,style,h){G&&G.texts.push({x,y,h:h||1,s,sz,col,style,life:0,max:style==='sfx'?1.1:0.9,rot:style==='sfx'?(Math.random()-0.5)*0.3:0});}
function addTextS(x,y,s,sz,col,style){G&&G.texts.push({sx:x,sy:y,s,sz,col,style:style||'small',life:0,max:style==='sfx'?1.1:1.1,rot:style==='sfx'?(Math.random()-0.5)*0.3:0});}
const dmgMul=t=>1+0.3*t.up;
const rangeOf=t=>T[t.type].range*Math.min(1.25,1+0.025*t.up);
function upCost(t){const d=T[t.type],base=d.cost?d.cost*0.75:110;return Math.round(base*Math.pow(1.35,t.up)/5)*5;}
function sellValue(t){return Math.floor(t.spent*0.6);}
function build(tx,ty,type){
  if(!tileFree(tx,ty)){sfx('deny');return false;}const d=T[type];
  if(G.gold<d.cost){sfx('deny');addText(tc(tx),tc(ty),'Need '+d.cost,15,C.red,'small',0.8);return false;}
  G.gold-=d.cost;const t={bornT:G.time,type,tx,ty,x:tc(tx),y:tc(ty),up:0,cd:0.2,aim:Math.PI/2,fireT:0,spent:d.cost,dealt:0,beam:null,pop:0};
  G.grid[ty][tx].tower=t;G.towers.push(t);sfx('build');fxRing(t.x,t.y,0.05,0.2,0.9,hexN(C[d.els[0]]));fxPuff(t.x,t.y,0.1,6,0xFFFFFF,0.8);return true;
}
function upgrade(t){const c=upCost(t);if(G.gold<c){sfx('deny');addText(t.x,t.y,'Need '+c,15,C.red,'small',1.6);return false;}G.gold-=c;t.spent+=c;t.up++;t.pop=0.3;sfx('upgrade');fxSpark(t.x,t.y,1.3,10,0xFFC03A);addText(t.x,t.y,'POWER UP',14,C.ink,'small',1.8);return true;}
function sell(t){G.gold+=sellValue(t);G.grid[t.ty][t.tx].tower=null;G.towers=G.towers.filter(x=>x!==t);sfx('sell');fxPuff(t.x,t.y,0.3,8,0xFFFFFF,1);addText(t.x,t.y,'+'+sellValue(t),14,C.gold,'small',1);}
function canFuse(a,b){return a&&b&&a!==b&&T[a.type].cost&&T[b.type].cost;}
function fuse(a,b){
  if(!canFuse(a,b)){sfx('deny');return false;}
  const type=RECIPES[pairKey(a.type,b.type)];
  const t={bornT:G.time,type,tx:b.tx,ty:b.ty,x:b.x,y:b.y,up:a.up+b.up,cd:0.3,aim:b.aim,fireT:0,spent:a.spent+b.spent,dealt:0,beam:null,pop:0.5};
  G.grid[b.ty][b.tx].tower=t;G.grid[a.ty][a.tx].tower=null;G.towers=G.towers.filter(x=>x!==a&&x!==b);G.towers.push(t);
  sfx('fuse');shake=Math.max(shake,0.15);fxRing(t.x,t.y,0.05,0.3,2,hexN(C[T[type].els[0]]));fxRing(t.x,t.y,0.1,0.3,1.5,hexN(C[T[type].els[1]]));fxSpark(t.x,t.y,1,16,0xFFC03A);fxPuff(a.x,a.y,0.3,8,0xFFFFFF,1);
  const isNew=!save.codex.includes(type);
  if(isNew){save.codex.push(type);persist();fusionReveal(type);}
  addText(t.x,t.y,T[type].k,46,C[T[type].els[0]],'sfx',2.2);
  if(G.sel){G.sel={tx:t.tx,ty:t.ty};}
  return true;
}

/* ---------------- ultimates ---------------- */
function tryUlt(){
  if(!G||G.result)return;const u=curUlt();
  if(G.ult.charge<ultNeed()){sfx('deny');addTextS(160,VH-140,'Not charged yet',15,C.red);return;}
  if(u.target){G.targeting=true;G.menu=null;G.fuseFrom=null;if(padActive||!ptr.inside){G.cursor.x=tc(G.sel.tx);G.cursor.y=tc(G.sel.ty);}}
  else fireUlt(u,0,0);
}
function fireUlt(u,x,y){G.ult.charge=0;G.targeting=false;cutin={t:0,dur:RM?0.6:1.05,u,then:()=>doUlt(u,x,y)};vidTry(cutin,u.id,true);sfx('cutin');}
function doUlt(u,x,y){
  const w=G.wave||1,sc=MAPS[G.mi].hp;
  if(u.id==='meteor'){G.specials.push({k:'meteor',x,y,t:0,dur:0.6,dmg:(450+130*w)*sc});}
  if(u.id==='tsunami'){
    G.specials.push({k:'wave',t:0,dur:1.4});sfx('wave');shake=Math.max(shake,0.35);addTextS(VW/2,VH/2,u.sfx,92,C.water,'sfx');
    for(const e of G.enemies){damage(e,(260+80*w)*sc,['water'],false,null);if(!e.dead){e.d=Math.max(0,e.d-(e.boss?90:240));slowE(e,0.5,3);}}
  }
  if(u.id==='tornado'){G.specials.push({k:'tornado',x,y,t:0,dur:3.5,r:210,dps:(70+24*w)*sc});sfx('wind');addText(x,y,u.sfx,76,C.air,'sfx',6.6);}
}

/* ---------------- update ---------------- */
function update(dt){
  G.time+=dt;
  {const need=ultNeed(),was=G.ult.charge;G.ult.charge=Math.min(need,G.ult.charge+dt);if(was<need&&G.ult.charge>=need){sfx('ready');addTextS(160,VH-140,'Ultimate ready!',16,C.red);}}
  for(const s of G.spawners){s.t-=dt;while(s.t<=0&&s.i<s.list.length){const it=s.list[s.i];spawnEnemy(it.type,s.wave);s.t+=it.gap;s.i++;}}
  G.spawners=G.spawners.filter(s=>s.i<s.list.length);
  const P=G.P;
  for(const e of G.enemies){
    if(e.dead)continue;
    e.hitT-=dt;e.weakT-=dt;
    if(e.lift>0){e.lift-=dt;}
    else if(e.stunT>0)e.stunT-=dt;
    else{const sp=e.speed*(e.slowT>0?1-e.slowF:1);e.d+=sp*dt;e.ph+=sp*dt*0.16;}
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0;}
    if(e.burnT>0){e.burnT-=dt;damage(e,e.burnDps*dt,e.burnEls||['fire'],true,null);if(e.dead)continue;if(Math.random()<dt*6)fxFlame(e.x,e.y,0.5*e.s);}
    if(e.type==='ninja'&&e.stunT<=0&&e.lift<=0){e.blinkT-=dt;if(e.blinkT<=0){e.blinkT=3;fxPuff(e.x,e.y,0.3,6,0x8C84A8,0.8);e.d+=85;const q=posAt(P,e.d);fxPuff(q.x,q.y,0.3,6,0x8C84A8,0.8);}}
    if(e.type==='shogun'){e.elT+=dt;if(e.elT>6){e.elT=0;e.el=ELS[(ELS.indexOf(e.el)+1)%4];addText(e.x,e.y,EL[e.el].k+'!',40,C[e.el],'sfx',3);}
      e.sumT-=dt;if(e.sumT<=0){e.sumT=9;for(let i=0;i<3;i++){spawnEnemy('grunt',e.wave,Math.max(0,e.d-20-i*18));G.waveLeft[e.wave]++;}addText(e.x,e.y,'来い!',34,C.red,'sfx',2.6);}}
    const p=posAt(P,e.d);e.dx=p.dx;e.dy=p.dy;e.x=p.x;e.y=p.y;
    if(e.d>=P.L){e.dead=true;G.waveLeft[e.wave]--;G.hp-=e.dmg;shake=Math.max(shake,e.boss?0.5:0.18);sfx('leak');addText(e.x,e.y,'-'+e.dmg,22,C.red,'small',1.6);fxRing(e.x,e.y,0.05,0.2,1.6,0xEF5459);}
  }
  for(const t of G.towers)updateTower(t,dt);
  updateProjs(dt);
  for(const p of G.pools){p.t+=dt;for(const e of G.enemies){if(e.dead)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<p.r){damage(e,p.dps*dt,p.els,true,p.src);if(p.slow)slowE(e,p.slow,0.3);}}}
  G.pools=G.pools.filter(p=>p.t<p.dur);
  updateSpecials(dt);
  for(const n in G.waveLeft){if(G.waveLeft[n]<=0&&!G.cleared[n]&&!G.spawners.some(s=>s.wave==n)){G.cleared[n]=true;const b=12+2*n;G.gold+=b;addTextS(VW/2,150,'Wave '+n+' cleared  +'+b,22,C.ink);}}
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(!G.result){
    if(G.hp<=0){G.hp=0;endGame(false);}
    else if(G.wave===20&&G.spawners.length===0&&G.enemies.length===0)endGame(true);
  }
}
function endGame(win){
  clearCuts();
  G.result=win?'win':'lose';G.resultT=0;MUS.mode='title';
  if(win){const first=!save.cleared[G.mi];save.cleared[G.mi]=true;G.unlocked=first?ULTS.find(u=>u.unlock===G.mi):null;sfx('win');}
  else sfx('lose');
  save.best[G.mi]=Math.max(save.best[G.mi]||0,win?20:G.wave-1);persist();focusId=null;
}
function firstInRange(t,range,exclude){let best=null;for(const e of G.enemies){if(e.dead||e.d<=60||(exclude&&exclude.has(e)))continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=range&&(!best||e.d>best.d))best=e;}return best;}
const handH=t=>0.95*(1+Math.min(0.2,t.up*0.02));
function updateTower(t,dt){
  const d=T[t.type],range=rangeOf(t),mul=dmgMul(t);t.cd-=dt;t.fireT-=dt;t.pop=Math.max(0,t.pop-dt);
  const aimAt=e=>{t.aim=Math.atan2(e.y-t.y,e.x-t.x);t.fireT=0.18;};
  if(d.kind==='beam'){
    const e=firstInRange(t,range);t.beam=e;
    if(e){aimAt(e);damage(e,d.dps*mul*dt,d.els,true,t);applyFx(e,d,mul);sfx('beam',120);}
    return;
  }
  if(t.cd>0)return;
  if(d.kind==='pulse'){
    let any=false;for(const e of G.enemies){if(e.dead||e.d<=60)continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=range){any=true;damage(e,d.dmg*mul,d.els,false,t);applyFx(e,d,mul);}}
    if(any){t.cd=1/d.rate;t.fireT=0.2;fxRing(t.x,t.y,0.15,0.1,range/TS,t.type==='sand'?0xC4874A:0xFFFFFF,t.type==='sand'?0.35:0.55);if(t.type==='steam')fxPuff(t.x,t.y,0.6,5,0xFFFFFF,1.2,range/TS*0.6);sfx('pulse',t.type==='sand'?250:80);}
    return;
  }
  const e=firstInRange(t,range);if(!e)return;
  t.cd=1/d.rate;aimAt(e);
  const hh=handH(t);
  if(d.kind==='bolt')G.projs.push({k:'bolt',x:t.x+Math.cos(t.aim)*10,y:t.y+Math.sin(t.aim)*10,h:hh,target:e,tx:e.x,ty:e.y,type:t.type,d,mul,src:t,speed:d.speed});
  else if(d.kind==='multi'){const hit=new Set();for(let i=0;i<d.n;i++){const tg=firstInRange(t,range,hit);if(!tg)break;hit.add(tg);G.projs.push({k:'bolt',x:t.x,y:t.y,h:hh,target:tg,tx:tg.x,ty:tg.y,type:t.type,d,mul,src:t,speed:d.speed});}}
  else if(d.kind==='lob'){const dist=Math.hypot(e.x-t.x,e.y-t.y),lead=e.speed*(e.slowT>0?1-e.slowF:1)*(0.45+dist/650)*(e.stunT>0?0:0.8);const p=posAt(G.P,e.d+lead);G.projs.push({k:'lob',sx:t.x,sy:t.y,h0:hh,tx:p.x,ty:p.y,t:0,dur:0.45+dist/650,h:(60+dist*0.3)/TS,type:t.type,d,mul,src:t});}
  else if(d.kind==='chain'){
    const hit=new Set([e]);const pts=[[t.x,t.y,hh],[e.x,e.y,0.45*e.s]];let cur=e,dm=d.dmg*mul;damage(e,dm,d.els,false,t);
    for(let i=0;i<d.chains;i++){let nb=null,bd=115;for(const o of G.enemies){if(o.dead||hit.has(o))continue;const dd=Math.hypot(o.x-cur.x,o.y-cur.y);if(dd<bd){bd=dd;nb=o;}}if(!nb)break;hit.add(nb);dm*=0.85;damage(nb,dm,d.els,false,t);pts.push([nb.x,nb.y,0.45*nb.s]);cur=nb;}
    fxBolt(pts);sfx('zap');
  }
  else if(d.kind==='root'){damage(e,d.dmg*mul,d.els,false,t);applyFx(e,d,mul);fxRoots(e.x,e.y);sfx('root');}
  const s={fire:'fire',water:'water',earth:'earth',air:'air',tempest:'air',ice:'ice',whirl:'water',mountain:'earth',magma:'earth'}[t.type];if(s)sfx(s,s==='air'?90:60);
}
function impactAt(x,y,p){
  const d=p.d,dm=d.dmg*p.mul,col=hexN(C[d.els[0]]);
  if(d.splash){for(const e of G.enemies){if(e.dead)continue;if(Math.hypot(e.x-x,e.y-y)<=d.splash+e.s*6){damage(e,dm,d.els,false,p.src);applyFx(e,d,p.mul);}}
    fxRing(x,y,0.05,0.1,d.splash/TS,col,0.35);fxChunks(x,y,p.type==='mountain'?12:6,hexN(C[d.els[d.els.length-1]]));
    if(p.type==='mountain'){shake=Math.max(shake,0.2);addText(x,y,'ドカッ',32,C.paper,'sfx',1.4);}
  } else if(p.target&&!p.target.dead){damage(p.target,dm,d.els,false,p.src);applyFx(p.target,d,p.mul);fxSpark(x,y,0.45*p.target.s,5,col);}
  if(d.pool)G.pools.push({x,y,r:d.pool.r,dps:d.pool.dps*p.mul,dur:d.pool.dur,t:0,slow:d.pool.slow,els:d.els,src:p.src,type:p.type});
  sfx('hit',70);
}
function updateProjs(dt){
  for(const p of G.projs){
    if(p.k==='bolt'){
      let th=0.45;if(p.target&&!p.target.dead){p.tx=p.target.x;p.ty=p.target.y;th=0.45*p.target.s;}
      const dx=p.tx-p.x,dy=p.ty-p.y,dd=Math.hypot(dx,dy),st=p.speed*dt;
      p.ang=Math.atan2(dy,dx);p.h=lerp(p.h,th,Math.min(1,st/Math.max(dd,1)));
      if(dd<=st+4){if(p.target&&p.target.dead&&!p.d.splash){p.done=true;continue;}impactAt(p.tx,p.ty,p);p.done=true;}
      else{p.x+=dx/dd*st;p.y+=dy/dd*st;}
      if(p.type==='fire'&&Math.random()<0.4)fxFlame(p.x,p.y,p.h,0.6);
    } else {p.t+=dt;if(p.t>=p.dur){impactAt(p.tx,p.ty,p);p.done=true;}}
  }
  G.projs=G.projs.filter(p=>!p.done);
}
function updateSpecials(dt){
  for(const s of G.specials){
    s.t+=dt;
    if(s.k==='meteor'&&s.t>=s.dur&&!s.hit){s.hit=true;
      for(const e of G.enemies){if(Math.hypot(e.x-s.x,e.y-s.y)<150){damage(e,s.dmg,['fire'],false,null);if(!e.dead){e.burnDps=Math.max(e.burnDps,20);e.burnT=4;e.burnEls=['fire'];}}}
      G.pools.push({x:s.x,y:s.y,r:90,dps:25*(G.wave||1)*0.6,dur:3,t:0,els:['fire'],type:'magma'});
      shake=Math.max(shake,0.6);flash=RM?0:0.2;speedLines=0.8;fxRing(s.x,s.y,0.05,0.5,4.2,0xFF6F3C,0.6);fxRing(s.x,s.y,0.1,0.3,3,0xFFFFFF,0.45);
      addText(s.x,s.y,'ドーン!',96,C.fire,'sfx',2.6);sfx('boom');G.specials.push({k:'shock',x:s.x,y:s.y,t:0,dur:0.9},{k:'scorch',x:s.x,y:s.y,t:0,dur:5});fxSpark(s.x,s.y,0.6,18,0xFFB33C);fxSpark(s.x,s.y,0.4,10,0xFF6F3C);fxChunks(s.x,s.y,20,0x7A5A4A);fxPuff(s.x,s.y,0.3,14,0xFFB36B,2.2);
    }
    if(s.k==='tornado'){
      for(const e of G.enemies){if(e.dead)continue;const dd=Math.hypot(e.x-s.x,e.y-s.y);if(dd<s.r){damage(e,s.dps*dt,['air'],true,null);if(e.boss)slowE(e,0.5,0.3);else{e.lift=Math.max(e.lift,0.25);}}}
    }
  }
  G.specials=G.specials.filter(s=>s.t<s.dur+(s.k==='meteor'?0.1:0));
}

const P3=[];

function addP(m,o){if(!R||!curScene())return;if(P3.length>420){const old=P3.shift();old.m.parent&&old.m.parent.remove(old.m);}m.castShadow=false;curScene().add(m);P3.push(Object.assign({m,life:0},o));}

  for(let i=0;i<pts.length-1;i++){const a=W3(pts[i][0],pts[i][1],pts[i][2]),b=W3(pts[i+1][0],pts[i+1][1],pts[i+1][2]);let prev=a;for(let k=1;k<=3;k++){const q=k===3?b:a.clone().lerp(b,k/3).add(new THREE.Vector3((Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3));const s=new THREE.Mesh(cg,m);s.position.copy(prev);s.lookAt(q);s.scale.z=prev.distanceTo(q);grp.add(s);prev=q;}}
  addP(grp,{vx:0,vy:0,vz:0,max:0.18,kind:'static'});}
function updateP3(dt){
  for(const p of P3){p.life+=dt;const u=p.life/p.max,m=p.m;
    if(p.kind==='ring'){const r=lerp(p.r0,p.r1,ease(u));m.scale.set(r,r,r);m.material.opacity=0.85*(1-u);}
    else if(p.kind==='root'){const g=u<0.2?u/0.2:u>0.7?1-(u-0.7)/0.3:1;m.scale.set(g,g,g);}
    else if(p.kind!=='static'){m.position.x+=p.vx*dt;m.position.y+=p.vy*dt;m.position.z+=p.vz*dt;p.vy+=p.grav*dt;if(p.kind==='puff'){p.vx*=0.94;p.vz*=0.94;}
      if(p.floor&&m.position.y<0.05){m.position.y=0.05;p.vy*=-0.3;p.vx*=0.6;p.vz*=0.6;}
      if(p.spin){m.rotation.x+=p.spin*dt;m.rotation.y+=p.spin*dt*0.7;}
      const s=p.s0*(p.kind==='puff'?(u<0.25?lerp(0.4,1.2,u/0.25):1.2*(1-(u-0.25)/0.75)):(1-u*u));m.scale.setScalar(Math.max(0.001,s));}
    if(u>=1){m.parent&&m.parent.remove(m);p.dead=true;}}
  for(let i=P3.length-1;i>=0;i--)if(P3[i].dead)P3.splice(i,1);
}

const LIVE={enemies:new Map(),towers:new Map(),projs:new Map(),pools:new Map(),specials:new Map()};
function clearMeshes(){for(const k in LIVE){for(const [,m] of LIVE[k])m.parent&&m.parent.remove(m);LIVE[k].clear();}for(const p of P3)p.m.parent&&p.m.parent.remove(p.m);P3.length=0;}
function syncKind(kind,list,make,upd){
  const L=LIVE[kind],seen=new Set();
  for(const o of list){seen.add(o);let m=L.get(o);if(!m){m=make(o);if(!m)continue;MAP3.scene.add(m);L.set(o,m);}upd(o,m);}
  for(const [o,m] of L)if(!seen.has(o)){m.parent&&m.parent.remove(m);if(m.userData&&m.userData.beam)m.userData.beam.parent&&m.userData.beam.parent.remove(m.userData.beam);if(m.userData&&m.userData.extra)m.userData.extra.parent&&m.userData.extra.parent.remove(m.userData.extra);L.delete(o);}
}

function handleInput(){

    const ev=inQ.shift();
    if(ev.a==='mute'){save.sound=!save.sound;applyVolumes();persist();toast(save.sound?'Sound on':'Sound off');continue;}
    if(curtain)continue;
    if(screen==='intro'){if(['click','confirm','next','ult'].includes(ev.a)){press.id='start';press.t=0.14;leaveIntro();}continue;}
    if((bossCut||cutin)&&screen==='play'){if(['click','confirm','back','next','ult'].includes(ev.a))skipCut();continue;}
    if(screen==='play'&&!paused&&!(G&&G.result))playInput(ev);
    else menuInput(ev);
  }
}
function hitUI(x,y){for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b;}return null;}
function moveFocus(dir,list){
  list=list||UI.filter(b=>b.nav!==false&&!b.hud);if(!list.length)return;
  let cur=list.find(b=>b.id===focusId);if(!cur){focusId=list[0].id;return;}
  const cx=cur.x+cur.w/2,cy=cur.y+cur.h/2;let best=null,bs=1e9;
  for(const b of list){if(b===cur)continue;const dx=b.x+b.w/2-cx,dy=b.y+b.h/2-cy;
    const ok=dir==='left'?dx<-4:dir==='right'?dx>4:dir==='up'?dy<-4:dy>4;if(!ok)continue;
    const main=dir==='left'||dir==='right'?Math.abs(dx):Math.abs(dy),off=dir==='left'||dir==='right'?Math.abs(dy):Math.abs(dx);
    const sc=main+off*2.2;if(sc<bs){bs=sc;best=b;}}
  if(best){focusId=best.id;sfx('click');}
}
function menuInput(ev){
  if(ev.a==='click'){const b=hitUI(ev.x,ev.y);if(b&&(!ev.downId||ev.downId===b.id)){if(b.disabled){sfx('deny');if(b.act&&b.id.startsWith('map'))b.act();}else if(b.act){sfx('click');b.act();}}return;}
  if(['up','down','left','right'].includes(ev.a)){moveFocus(ev.a);return;}
  if(ev.a==='confirm'){const b=UI.find(b=>b.id===focusId);if(b&&!b.disabled&&b.act){sfx('click');press.id=b.id;press.t=0.14;b.act();}else if(b&&b.disabled)sfx('deny');else if(!b)moveFocus('down');return;}
  if(ev.a==='back'||ev.a==='pause'){
    if(screen==='play'&&paused&&!G.result){if(pauseView==='settings'){pauseView='main';focusId=nav()?'psettings':null;}else paused=false;return;}
    if(screen==='maps'||screen==='codex'||screen==='help'||screen==='settings'){sfx('click');go(()=>{screen='title';focusId=null;},{soft:true});}
    return;
  }
}

function openMenu(tile){
  G.sel={tx:tile.tx,ty:tile.ty};const cell=G.grid[tile.ty][tile.tx];
  if(G.fuseFrom){const b=cell.tower;if(b&&b!==G.fuseFrom){if(canFuse(G.fuseFrom,b)){fuse(G.fuseFrom,b);G.fuseFrom=null;}else{sfx('deny');addText(b.x,b.y,'Only base towers fuse',14,C.red,'small',1.6);}}else if(b===G.fuseFrom)G.fuseFrom=null;else sfx('deny');return;}
  if(cell.tower){G.menu='tower';G.menuT=0;focusId=null;sfx('click');return;}
  if(cell.road){sfx('deny');addText(tc(tile.tx),tc(tile.ty),'That’s the road',14,C.red,'small',0.6);closeMenu();return;}
  if(cell.block){sfx('deny');addText(tc(tile.tx),tc(tile.ty),'Something’s in the way',14,C.red,'small',0.8);closeMenu();return;}

function closeMenu(){if(G)G.menu=null;focusId=null;}
function playInput(ev){
  const a=ev.a;
  if(a==='pause'){doPause();return;}
  if(a==='speed'){G.speed=G.speed===1?2:1;toast('Speed '+G.speed+'×');press.id='speed';press.t=0.14;return;}
  if(a==='rotL'){CAM.taz+=Math.PI/8;return;}if(a==='rotR'){CAM.taz-=Math.PI/8;return;}
  if(a==='zoomIn'){CAM.tr=clamp(CAM.tr*0.88,12,44);return;}if(a==='zoomOut'){CAM.tr=clamp(CAM.tr*1.12,12,44);return;}
  if(G.targeting){
    if(a==='click'){const b=hitUI(ev.x,ev.y);if(b&&b.hud){if(!b.disabled&&b.act)b.act();return;}const g=groundAt(ev.x,ev.y);if(g)fireUlt(curUlt(),g.gx,g.gy);return;}
    if(a==='confirm'||a==='ult'){fireUlt(curUlt(),G.cursor.x,G.cursor.y);return;}
    if(a==='back'){G.targeting=false;return;}
    if(['up','down','left','right'].includes(a)){const f=camFwd(),rt=[-f[1],f[0]];const v=a==='up'?f:a==='down'?[-f[0],-f[1]]:a==='right'?rt:[-rt[0],-rt[1]];G.cursor.x=clamp(G.cursor.x+v[0]*40,0,W);G.cursor.y=clamp(G.cursor.y+v[1]*40,0,H);return;}
    return;
  }
  if(cutin)return;
  if(a==='next'){press.id='next';press.t=0.14;callWave();return;}
  if(a==='ult'){press.id='ultbtn';press.t=0.14;tryUlt();return;}
  if(a==='cycle'){const n=ultsAvail().length;if(n>1){G.ult.idx=(G.ult.idx+1)%n;sfx('click');}else toast('Clear a map to unlock more ultimates');return;}
  if(a==='click'){
    const b=hitUI(ev.x,ev.y);if(b){if(ev.downId&&ev.downId!==b.id)return;if(!b.disabled&&b.act)b.act();else sfx('deny');return;}
    const tile=tileAtScreen(ev.x,ev.y);
    if(tile){if(G.menu&&G.sel.tx===tile.tx&&G.sel.ty===tile.ty&&!G.fuseFrom){closeMenu();return;}openMenu(tile);}
    else{G.fuseFrom=null;closeMenu();}
    return;
  }
  if(a==='back'){if(G.fuseFrom){G.fuseFrom=null;return;}if(G.menu){closeMenu();return;}return;}
  if(G.menu){
    if(['up','down','left','right'].includes(a)){const b=UI.find(b=>b.dir===a);if(b){focusId=b.id;sfx('click');}return;}
    if(a==='confirm'){const b=UI.find(b=>b.id===focusId);if(b&&b.act&&!b.disabled){press.id=b.id;press.t=0.14;b.act();}else if(b)sfx('deny');return;}
    const t=G.grid[G.sel.ty][G.sel.tx].tower;
    if(G.menu==='build'&&['b1','b2','b3','b4'].includes(a)){const ty=ELS[+a[1]-1];if(build(G.sel.tx,G.sel.ty,ty))closeMenu();return;}
    if(G.menu==='tower'&&t){
      if(a==='upgrade'){upgrade(t);return;}
      if(a==='fuse'){startFuse(t);return;}
      if(a==='sell'){sell(t);closeMenu();return;}
    }
    return;
  }
  if(['up','down','left','right'].includes(a)){moveSel(a);return;}
  if(a==='confirm'){openMenu(G.sel);return;}
  const t=G.grid[G.sel.ty][G.sel.tx].tower;
  if(t&&a==='upgrade')upgrade(t);
  if(t&&a==='fuse'&&!G.fuseFrom)startFuse(t);
  if(t&&a==='sell'&&!G.fuseFrom)sell(t);
}
function startFuse(t){
  if(!T[t.type].cost){sfx('deny');addText(t.x,t.y,'Fused towers are final',14,C.red,'small',1.6);return;}
  if(!G.towers.some(o=>o!==t&&T[o.type].cost)){sfx('deny');addText(t.x,t.y,'Build another base tower first',14,C.red,'small',1.6);return;}
  G.fuseFrom=t;closeMenu();sfx('click');
}

/* screen transitions: a paper-and-ink wipe with a seal for heavy swaps (map load), a quick fade for menus */
let curtain=null,screenT=0;
function go(fn,o={}){
  if(curtain)return;
  if(window.__jcInstant){fn();screenT=1;return;}
  const soft=!!o.soft;curtain={t:0,dur:RM?(soft?0.16:0.3):(soft?0.3:0.7),fn,soft,fired:false};
}
function updCurtain(dt){if(!curtain)return;curtain.t+=dt;if(!curtain.fired&&curtain.t>=curtain.dur/2){curtain.fired=true;const f=curtain.fn;try{f();}finally{screenT=0;}}if(curtain.t>=curtain.dur)curtain=null;}
function drawCurtain(){
  const c=curtain;const u=c.t/c.dur,a=1-Math.abs(u*2-1);
  if(c.soft){ctx.fillStyle=alpha(C.paper,0.65*a);ctx.fillRect(0,0,VW,VH);return;}
  if(RM){ctx.fillStyle=alpha('#2A1F2E',a);ctx.fillRect(0,0,VW,VH);return;}

  ctx.restore();
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=clamp((now-last)/1000,0,0.05);last=now;animT+=dt;frameDt=dt;screenT+=dt;
  pollPad(dt);
  if(screen==='play'&&G&&!paused&&!padActive&&!kbNav&&ptr.inside&&ptr.type==='mouse'&&!G.targeting&&camera){G.hover=tileAtScreen(ptr.x,ptr.y);}else if(G)G.hover=null;
  if(screen==='play'&&G&&G.targeting&&!padActive&&ptr.inside){const g=groundAt(ptr.x,ptr.y);if(g){G.cursor.x=g.gx;G.cursor.y=g.gy;}}
  handleInput();
  updCurtain(dt);
  if(press.t>0)press.t-=dt;
  if(paused){for(const c of [bossCut,cutin])if(c&&c.vid&&c.vid.mode==='video'&&!c.vid.v.el.paused)c.vid.v.el.pause();}
  if(screen==='play'&&G&&!paused){
    if(G.menu)G.menuT=(G.menuT||0)+dt;
    if(bossCut){vidTick(bossCut,dt);bossCut.t+=dt;if(bossCut.t>=bossCut.dur)endCut();}
    else if(cutin){vidTick(cutin,dt);cutin.t+=dt;if(cutin.t>=cutin.dur){const f=cutin.then;vidStop(cutin);cutin=null;f();}}
    else if(!G.result||G.resultT<1){for(let i=0;i<G.speed;i++)update(dt);}
    updateFx(dt);
  }
  updateP3(dt);
  shake=Math.max(0,shake-dt*1.5);flash=Math.max(0,flash-dt);speedLines=Math.max(0,speedLines-dt);
  if(toastMsg){toastMsg.t+=dt;if(toastMsg.t>1.8)toastMsg=null;}
  render(dt);
  draw();
  const hb=ptr.inside&&!nav()&&ptr.type==='mouse'?hitUI(ptr.x,ptr.y):null;cv.style.cursor=G&&G.drag?'grabbing':(hb&&hb.act&&!hb.disabled)||screen==='intro'||(screen==='play'&&G&&(G.hover||G.targeting))?'pointer':'default';
  musicTick();
}
function updateFx(dt){
  if(!G)return;
  for(const t of G.texts)t.life+=dt;G.texts=G.texts.filter(t=>t.life<t.max);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}
  if(G.result)G.resultT+=dt;
}
function render(dt){
  if(!R)return;
  if(screen==='play'&&G&&MAP3){updateCamera(dt);sync3D(dt);
    const sh=RM?Math.min(shake,0.05):shake;if(sh>0){camera.position.x+=(Math.random()-0.5)*sh;camera.position.y+=(Math.random()-0.5)*sh;}
    R.render(MAP3.scene,camera);}
  else{updateLobby3D(dt);R.render(LS,lcam);}
}
function draw(){

  ctx.setTransform(K*US,0,0,K*US,0,0);TIPQ=null;ghost=false;

    if(speedLines>0)speedBurst(Math.min(1,speedLines),VW/2,VH/2);
    if(cutin){TIPQ=null;inWorld(drawCutin);}
    if(bossCut){UI=[];TIPQ=null;inWorld(drawBossCut);}
    if(paused&&!G.result){UI=[];TIPQ=null;drawPause();}
    if(G.result){UI=[];TIPQ=null;drawResult();}
    if(flash>0){ctx.fillStyle=alpha('#FFFFFF',Math.min(0.8,flash*3));ctx.fillRect(0,0,VW,VH);}

  drawTipQ();
  if(toastMsg){const a=toastMsg.t>1.4?(1.8-toastMsg.t)/0.4:1;ctx.save();ctx.globalAlpha=a;ctx.font=font(15,false);const w=ctx.measureText(toastMsg.s).width+40;panel(VW/2-w/2,VH-150,w,38,{fill:C.ink,r:19});txt(toastMsg.s,VW/2,VH-130,15,{col:C.paper,align:'center'});ctx.restore();}
  if(curtain)drawCurtain();
}
