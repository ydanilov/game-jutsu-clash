:root{

  --tone:#EADBC4;

  --gold:#FFB52E;

  --sakura:#FFB3C8;

  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
:root{padding:0!important}
body{margin:0;background:var(--ground);display:grid;place-items:center;overflow:hidden;font-family:var(--body);box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink),0 24px 70px rgba(0,0,0,.55)}
body.compact #stage{border-radius:0;box-shadow:none}
#world,#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none;outline:none}
#nogl[hidden]{display:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);font:800 18px var(--body);text-align:center;padding:24px}
#safeprobe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* portrait-phone prompt: the game plays in landscape */
#rotate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;box-sizing:border-box;
  background:linear-gradient(rgba(42,31,46,.25),rgba(42,31,46,.8)),url(assets/jc_title.webp) 50% 40%/cover no-repeat,linear-gradient(165deg,#7E9ED6,#C8A8D8 42%,#FFC29A 72%,#FFE3A6)}
#rotate[hidden]{display:none}
.rot-card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 rgba(59,42,37,.35);padding:24px 26px 20px;max-width:290px;text-align:center}
.rot-logo{font:38px/1 var(--display);color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.01em}
.rot-logo b{display:block;font-weight:400;color:var(--red);margin-top:2px}
.rot-seal{display:inline-block;margin:12px 0 0;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;font:800 13px var(--body);background:var(--paper)}
.rot-phone{width:44px;height:74px;margin:20px auto 16px;border:4px solid var(--ink);border-radius:11px;position:relative;background:var(--gold);animation:rot 2.6s cubic-bezier(.6,0,.3,1) infinite}
.rot-phone::after{content:'';position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink)}
@keyframes rot{0%,18%{transform:rotate(0)}42%,78%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rot-phone{animation:none;transform:rotate(-90deg)}}
.rot-by{display:block;margin-top:8px;font:800 12px var(--body);opacity:.7}
.rot-card p{font:800 18px/1.3 var(--body);margin:0 0 6px}
.rot-card small{display:block;font:500 13px/1.4 var(--body);opacity:.75}
.rot-card button{margin-top:16px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:22px;background:var(--paper);color:var(--ink);font:800 14px var(--body);cursor:pointer}
.rot-card button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>

function roadCurve(path){
  // tile centres -> polyline with rounded corners (quadratic arcs), resampled every ~0.2 units
  const P=path.map(([i,j])=>new THREE.Vector2(i-GW/2+0.5,j-GH/2+0.5)),out=[P[0].clone()];
  const lineTo=q=>{const a=out[out.length-1],n=Math.max(1,Math.ceil(a.distanceTo(q)/0.2));for(let k=1;k<=n;k++)out.push(a.clone().lerp(q,k/n));};
  for(let k=1;k<P.length-1;k++){const A=P[k-1],C=P[k],B=P[k+1];const da=A.clone().sub(C),db=B.clone().sub(C);const r=Math.min(0.95,da.length()/2,db.length()/2);
    const p0=C.clone().add(da.normalize().multiplyScalar(r)),p1=C.clone().add(db.normalize().multiplyScalar(r));lineTo(p0);
    for(let s=1;s<=8;s++){const t=s/8,u=1-t;out.push(new THREE.Vector2(u*u*p0.x+2*u*t*C.x+t*t*p1.x,u*u*p0.y+2*u*t*C.y+t*t*p1.y));}}
  lineTo(P[P.length-1]);return out;

    const a=pts[Math.max(0,k-1)],b=pts[Math.min(N-1,k+1)],tx=b.x-a.x,tz=b.y-a.y,tl=Math.hypot(tx,tz)||1,nx=-tz/tl,nz=tx/tl,sk=sc[k];
    const hw=L.w*(1+0.09*Math.sin(sk*1.7)+0.05*Math.sin(sk*4.3+1)),wob=0.05*Math.sin(sk*0.9);

function paintMap(M){

/* ---------------- compact terraced dioramas (Sakura Hills v6) ----------------
   A map with `area` + `lay` is a small island cut out of the 32x18 logic grid: every tile outside
   the area is void. `lay` rows give each tile a terrace level (0-2), 'w'/'p' = stream / pool,
   '.' = void corner. Road tiles that change level become stone stairs; a road tile over water
   gets an arched bridge. TERR(wx,wz) returns the walkable height so enemies, towers and effects
   sit on the terraces. */
let TERR=null,AREA=null;
function zMin(){return G&&G.map&&G.map.cam&&G.map.cam.zmin||12;}

  return m.path.map(([x,y])=>[ox+(x-x0+0.5)*s-0.5,oy+(y-y0+0.5)*s-0.5]);}

function update(dt){
  G.time+=dt;
  {const need=ultNeed(),was=G.ult.charge;G.ult.charge=Math.min(need,G.ult.charge+dt);if(was<need&&G.ult.charge>=need){sfx('ready');addTextS(160,VH-140,'Ultimate ready!',16,C.red);}}
  for(const s of G.spawners){s.t-=dt;while(s.t<=0&&s.i<s.list.length){const it=s.list[s.i];spawnEnemy(it.type,s.wave,0,G.P2&&!E[it.type].boss?(it.lane!==undefined?it.lane:Math.floor(s.i/3)%2):0);s.t+=it.gap*(G.P2?0.85:1);s.i++;}}

  for(const e of G.enemies){
    if(e.dead)continue;const P=e.P;

    else if(e.stunT>0)e.stunT-=dt;
    else{const sp=e.speed*(e.slowT>0?1-e.slowF:1);e.d+=sp*dt;e.ph+=sp*dt*0.16;}
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0;}
    if(e.burnT>0){e.burnT-=dt;damage(e,e.burnDps*dt,e.burnEls||['fire'],true,null);if(e.dead)continue;if(Math.random()<dt*6)fxFlame(e.x,e.y,0.5*e.s);}
    if(e.type==='ninja'&&e.stunT<=0&&e.lift<=0){e.blinkT-=dt;if(e.blinkT<=0){e.blinkT=3;fxPuff(e.x,e.y,0.3,6,0x8C84A8,0.8);e.d+=85;const q=posAt(P,e.d);fxPuff(q.x,q.y,0.3,6,0x8C84A8,0.8);}}
    if(e.type==='shogun'){e.elT+=dt;if(e.elT>6){e.elT=0;e.el=ELS[(ELS.indexOf(e.el)+1)%4];addText(e.x,e.y,EL[e.el].k+'!',40,C[e.el],'sfx',3);}
      e.sumT-=dt;if(e.sumT<=0){e.sumT=9;for(let i=0;i<3;i++){spawnEnemy('grunt',e.wave,Math.max(0,e.d-20-i*18),e.P===G.P2?1:0);G.waveLeft[e.wave]++;}addText(e.x,e.y,'来い!',34,C.red,'sfx',2.6);}}
    const p=posAt(P,e.d);e.dx=p.dx;e.dy=p.dy;e.x=p.x;e.y=p.y;
    if(e.d>=P.L){e.dead=true;G.waveLeft[e.wave]--;G.hp-=e.dmg;shake=Math.max(shake,e.boss?0.5:0.18);sfx('leak');addText(e.x,e.y,'-'+e.dmg,22,C.red,'small',1.6);fxRing(e.x,e.y,0.05,0.2,1.6,0xEF5459);}
  }
  if(G.hp<=40)vidLoad('defeat');
  for(const t of G.towers)updateTower(t,dt);
  updateProjs(dt);
  for(const p of G.pools){p.t+=dt;for(const e of G.enemies){if(e.dead)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<p.r){damage(e,p.dps*dt,p.els,true,p.src);if(p.slow)slowE(e,p.slow,0.3);}}}
  G.pools=G.pools.filter(p=>p.t<p.dur);
  updateSpecials(dt);
  for(const n in G.waveLeft){if(G.waveLeft[n]<=0&&!G.cleared[n]&&!G.spawners.some(s=>s.wave==n)){G.cleared[n]=true;const b=12+2*n;G.gold+=b;addTextS(VW/2,150,'Wave '+n+' cleared  +'+b,22,C.ink);}}
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(!G.result){
    if(G.hp<=0){G.hp=0;endGame(false);}
    else if(G.wave===20&&G.spawners.length===0&&G.enemies.length===0)endGame(true);
  }
}

function firstInRange(t,range,exclude){let best=null;for(const e of G.enemies){if(e.dead||e.d<=60||(exclude&&exclude.has(e)))continue;if(Math.hypot(e.x-t.x,e.y-t.y)<=range&&(!best||e.P.L-e.d<best.P.L-best.d))best=e;}return best;}

  else if(d.kind==='multi'){const hit=new Set();for(let i=0;i<d.n;i++){const tg=firstInRange(t,range,hit);if(!tg)break;hit.add(tg);G.projs.push({k:'bolt',x:t.x,y:t.y,h:hh,target:tg,tx:tg.x,ty:tg.y,type:t.type,d,mul,src:t,speed:d.speed});}}

  else if(d.kind==='chain'){

    fxBolt(pts);sfx('zap');
  }
  else if(d.kind==='root'){damage(e,d.dmg*mul,d.els,false,t);applyFx(e,d,mul);fxRoots(e.x,e.y);sfx('root');}
  else if(d.kind==='storm'){// falls from the sky on up to n enemies in range
    const pool=G.enemies.filter(o=>!o.dead&&o.d>60&&Math.hypot(o.x-t.x,o.y-t.y)<=range);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    for(const tg of pool.slice(0,d.n)){const lead=tg.speed*(tg.slowT>0?1-tg.slowF:1)*0.5*(tg.stunT>0?0:1);const p=posAt(tg.P,tg.d+lead);G.projs.push({k:'lob',sx:p.x,sy:p.y,h0:t.type==='meteor'?7:4.5,tx:p.x,ty:p.y,t:0,dur:t.type==='meteor'?0.6:0.4,h:0,type:t.type,d,mul,src:t,target:d.splash?null:tg});}
    sfx(t.type==='rain'?'water':'earth',80);}

    const ax=Math.cos(t.aim),ay=Math.sin(t.aim);let n=0;for(const o of G.enemies){if(o.dead||o.d<=60)continue;const rx=o.x-t.x,ry=o.y-t.y,along=rx*ax+ry*ay;if(along<0||along>range)continue;if(Math.abs(rx*ay-ry*ax)<=16+o.s*6){damage(o,d.dmg*mul,d.els,false,t);applyFx(o,d,mul);n++;}}

function impactAt(x,y,p){

function updateProjs(dt){

      if(p.type==='fire'&&Math.random()<0.4)fxFlame(p.x,p.y,p.h,0.6);

function playInput(ev){

  if(a==='rotL'){CAM.taz+=Math.PI/8;return;}if(a==='rotR'){CAM.taz-=Math.PI/8;return;}if(a==='home'){camGoHome();sfx('click');return;}

    if(['up','down','left','right'].includes(a)){const f=camFwd(),rt=[-f[1],f[0]];const v=a==='up'?f:a==='down'?[-f[0],-f[1]]:a==='right'?rt:[-rt[0],-rt[1]];G.cursor.x=clamp(G.cursor.x+v[0]*40,0,W);G.cursor.y=clamp(G.cursor.y+v[1]*40,0,H);return;}

  if(a==='click'){

    const tile=tileAtScreen(ev.x,ev.y);

    else{G.fuseFrom=null;closeMenu();}

  if(G.menu){
    if(['up','down','left','right'].includes(a)){const b=UI.find(b=>b.dir===a);if(b){focusId=b.id;sfx('click');}return;}
    if(a==='confirm'){const b=UI.find(b=>b.id===focusId);if(b&&b.act&&!b.disabled){press.id=b.id;press.t=0.14;b.act();}else if(b)sfx('deny');return;}
    const t=G.grid[G.sel.ty][G.sel.tx].tower;
    if(G.menu==='build'&&['b1','b2','b3','b4'].includes(a)){const ty=ELS[+a[1]-1];if(build(G.sel.tx,G.sel.ty,ty))closeMenu();return;}
    if(G.menu==='tower'&&t){

    }
    return;
  }

  if(a==='confirm'){openMenu(G.sel);return;}

}

}

  ui(){return UI.map(b=>({id:b.id,x:b.x,y:b.y,w:b.w,h:b.h,disabled:!!b.disabled}));},
  // UI-space point -> client (CSS) coords, for synthetic input
  toClient(x,y){const r=cv.getBoundingClientRect();return{x:r.left+x/VW*r.width,y:r.top+y/VH*r.height};},
  center(id){const b=UI.find(b=>b.id===id);if(!b)return null;return this.toClient(b.x+b.w/2,b.y+b.h/2);},
  pick(cx,cy){const r=cv.getBoundingClientRect();const x=(cx-r.left)/r.width*VW,y=(cy-r.top)/r.height*VH;const h=hitUI(x,y);return{ui:h&&h.id,tile:tileAtScreen(x,y),cam:[CAM.az,CAM.taz,CAM.r,CAM.tr]};},
  snapCam(){for(const k of ['az','pol','r','tx','tz'])CAM[k]=CAM['t'+k];if(camera&&G){updateCamera(0);camera.updateMatrixWorld();}},
  tileClient(tx,ty){this.snapCam();const p=scr(tc(tx),tc(ty),0);return this.toClient(p.x,p.y);},
  freeTiles(n){const out=[];if(!G)return out;this.snapCam();for(let j=3;j<GH-3;j++)for(let i=4;i<GW-4;i++){if(tileFree(i,j)&&!out.some(o=>Math.abs(o.tx-i)+Math.abs(o.ty-j)<3)){const p=scr(tc(i),tc(j),0);if(p.x>VW*0.3&&p.x<VW*0.7&&p.y>VH*0.3&&p.y<VH*0.72)out.push({tx:i,ty:j});}if(out.length>=n)return out;}return out;},
  step(sec,dt){dt=dt||1/60;for(let i=0;i<sec/dt;i++){if(cutin){const f=cutin.then;cutin=null;f();}update(dt);updateFx(dt);if(G.result)break;}},
  startMap(i){curtain=null;startMap(i);},
  skipToWave(n){if(!G)return;G.enemies=[];G.spawners=[];G.projs=[];G.waveLeft={};for(let k=1;k<n;k++)G.cleared[k]=true;G.wave=n-1;callWave();},
  untilBoss(max){max=max||30;const st=1/30;for(let i=0;i<max/st;i++){while(bossCut&&bossCut.kind!=='boss')endCut();if(bossCut)break;update(st);}return bossCut?bossCut.type:null;},
  untilCut(kind,max){max=max||30;const st=1/30;for(let i=0;i<max/st;i++){if(bossCut&&bossCut.kind===kind)return bossCut.type;if(bossCut)endCut();update(st);}return bossCut&&bossCut.kind===kind?bossCut.type:null;},
  clearCuts(){clearCuts();},
  video(v,waitK){vidForce=v===undefined?null:v;vidWaitK=waitK||1;},
  resetReveals(){save.seenEnemies=[];revealLog.length=0;},
  preloadVideos(){for(const k in VID_INFO)vidLoad(k);},
  seenAll(){save.seenEnemies=BESTIARY.slice();},
  ult(id,tx,ty){const u=ULTS.find(q=>q.id===id);G.ult.charge=ultNeed();const p=tx!==undefined?{x:tc(tx),y:tc(ty)}:{x:W/2,y:H/2};fireUlt(u,p.x,p.y);},
  win(){if(!G)return;G.spawners=[];G.enemies=[];G.wave=20;endGame(true);},
  lose(){if(!G)return;G.hp=0;update(1/60);},
  gold(v){if(G)G.gold=v;},
  go(name){curtain=null;screen=name;focusId=null;screenT=1;},
  unlockAll(v){window.__jcUnlockAll=v!==false;},
  instant(v){window.__jcInstant=v!==false;},
  reducedMotion(v){save.rm=v?'on':'off';updRM();},
};

QLOW=save.q==='low'||(save.q==='auto'&&lowEnd());
init3D();
resize();
addEventListener('orientationchange',()=>setTimeout(resize,120));
document.getElementById('rotAnyway').addEventListener('click',()=>{rotDismissed=true;checkRotate();});
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Mochiy Pop One"','JUTSU火水土風').catch(()=>{});}
</script>
